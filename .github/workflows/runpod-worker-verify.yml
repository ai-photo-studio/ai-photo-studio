name: verify-runpod-worker-dev

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact digest-pinned image reference
        required: true
        type: string
      source_sha:
        description: Validated worker source SHA
        required: true
        type: string
      digest:
        description: Approved registry digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  APPROVED_SHA: 9926ae6d1ff87e64c805e86c6d66e9c8ca6c2eb7
  APPROVED_IMAGE: ghcr.io/ai-photo-studio/ai-photo-studio/runpod-worker-dev
  APPROVED_DIGEST: sha256:2ae480156b955e10d5c678aa5600e23ae22139bf8cba78b9bf2144c1f96d1278

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact approved reference
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          test "$INPUT_SOURCE_SHA" = "$APPROVED_SHA"
          test "$INPUT_DIGEST" = "$APPROVED_DIGEST"
          test "$INPUT_IMAGE" = "$APPROVED_IMAGE@$APPROVED_DIGEST"

      - name: Log in to GHCR read-only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact digest
        env:
          IMAGE: ${{ inputs.image }}
        run: docker pull "$IMAGE"

      - name: Verify digest and metadata
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' | tee repo-digests.json
          grep -F "$APPROVED_IMAGE@$APPROVED_DIGEST" repo-digests.json
          docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | grep -Fx "$APPROVED_SHA"
          docker image inspect "$IMAGE" --format 'image_id={{.Id}} architecture={{.Architecture}} os={{.Os}} size_bytes={{.Size}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} working_dir={{.Config.WorkingDir}} user={{.Config.User}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}' | tee image-metadata.txt

      - name: Scan metadata for prohibited secrets
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          metadata=$(docker image inspect "$IMAGE" --format '{{json .Config}}')
          if printf '%s' "$metadata" | grep -Eiq 'API_KEY|TOKEN|SECRET|PASSWORD|PRIVATE_KEY'; then
            echo 'prohibited secret reference found in image metadata'
            exit 1
          fi

      - name: Generate safe fixture
        run: |
          printf '%s' '{"mode":"dry_run","imageBase64":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="}' > request.json
          printf '%s' '{"mode":"dry_run","imageBase64":"YmFk"}' > corrupt.json

      - name: Verify health and dry run
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set +e
          printf '%s' '{"mode":"health"}' | docker run --rm --network none -i "$IMAGE" --stdin > health.stdout 2> health.stderr
          health_status=$?
          set -e
          echo "health_exit=$health_status"
          cat health.stdout
          cat health.stderr >&2
          test "$health_status" -eq 0
          jq -e '.ok == true and .mode == "health" and .providerPostCount == 0' health.stdout
          set +e
          docker run --rm --network none -i --mount "type=bind,source=$PWD/request.json,target=/request.json,readonly" "$IMAGE" --input-file /request.json > dry.stdout 2> dry.stderr
          dry_status=$?
          set -e
          echo "dry_run_exit=$dry_status"
          cat dry.stdout
          cat dry.stderr >&2
          test "$dry_status" -eq 0
          jq -e '.ok == true and .mode == "dry_run" and .providerPostCount == 0 and .gfpgan == "skipped" and .width == 1 and .height == 1 and .format == "png" and (.inputChecksum | type == "string" and length == 64)' dry.stdout

      - name: Verify corrupt rejection and clean exit
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set +e
          docker run --rm --network none -i --mount "type=bind,source=$PWD/corrupt.json,target=/corrupt.json,readonly" "$IMAGE" --input-file /corrupt.json > corrupt.stdout 2> corrupt.stderr
          status=$?
          set -e
          echo "corrupt_exit=$status"
          cat corrupt.stdout
          cat corrupt.stderr >&2
          test "$status" -ne 0
          grep -Fx 'Input buffer contains unsupported image format' corrupt.stderr

      - name: Record verification evidence
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker image inspect "$IMAGE" --format 'image={{index .RepoDigests 0}} image_id={{.Id}} revision={{index .Config.Labels "org.opencontainers.image.revision"}} architecture={{.Architecture}} os={{.Os}} size_bytes={{.Size}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} working_dir={{.Config.WorkingDir}} user={{.Config.User}}' > verification-evidence.txt
          cat verification-evidence.txt
          echo 'provider_post_count=0'
          echo 'runpod_contact=0'
