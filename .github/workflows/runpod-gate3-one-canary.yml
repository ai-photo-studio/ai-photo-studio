name: runpod-gate3-one-canary

# Executes exactly ONE non-production RunPod Serverless canary job against the
# published, immutable volume-mapped GFPGAN handler image. This workflow is
# workflow_dispatch-only and requires an exact confirmation string. It creates
# exactly one private Serverless template, one queue endpoint, and submits
# exactly one restore job using the canonical synthetic fixture. It never
# retries or resubmits, never touches the Network Volume or its weights, and
# always attempts endpoint/template cleanup in a final always() step.
#
# Gate 3 approval statement (user, 2026-08-01): explicit approval for exactly
# one non-production RunPod Serverless canary, scoped to the fixed
# configuration below. Gate 4 (production activation) remains prohibited.
# Replicate remains production; this workflow never calls Replicate.
#
# DISPATCH SEMANTICS (protected protocol, corrected 2026-08-01): a Gate 3
# approval authorizes exactly ONE workflow_dispatch of this file, which must
# submit exactly ONE job, with ZERO workflow reruns. This is stricter than
# "one executed job" alone: ANY preflight or workflow-implementation defect
# that causes a dispatch to fail -- even with zero RunPod resources created
# and zero cost -- consumes that dispatch's authorization. Repairing the
# defect and dispatching again always requires a NEW, separate, explicit
# Gate 3 approval statement, never a reinterpretation of the prior one.
# (Historical note, not a precedent: the 2026-08-01 canary record documents
# three dispatches -- 30691165812 and 30691290437 failed at a preflight/
# workflow-implementation bug before any job existed, and 30691401701 is the
# one dispatch that actually executed the one authorized job. That sequence
# reflects how that specific approval was interpreted at the time. It must NOT be read as license for multiple dispatches under a single future approval.
# Every future dispatch -- successful, failed, or defect-blocked -- is exactly one attempt against exactly one approval, full stop.)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type EXECUTE_ONE_GATE3_CANARY to proceed"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runpod-gate3-one-canary
  cancel-in-progress: false

env:
  RUNPODCTL_VERSION: "v2.8.0"
  IMAGE_DIGEST: "sha256:91052a538454d2996b6f27b561a8b9f7d07636d396f7dd8d1713baf9f9a5ea0d"
  IMAGE_REPOSITORY: "ghcr.io/ai-photo-studio/ai-photo-studio/runpod-worker-gpu-serverless-volume-restore-unpack-fix-cwd-dev"
  TARGET_DATACENTER_ID: "EU-RO-1"
  TARGET_GPU_TYPE_ID: "NVIDIA RTX 4000 Ada Generation"
  NETWORK_VOLUME_ID: "d6a4504x8m"
  S3_ENDPOINT: "https://s3api-eu-ro-1.runpod.io"
  AWS_DEFAULT_REGION: "eu-ro-1"
  TEMPLATE_NAME: "photo-restoration-gate3-canary-template"
  ENDPOINT_NAME: "photo-restoration-gate3-canary"
  RATE_CEILING_USD_PER_SECOND: "0.00016"
  BUDGET_USD: "0.05"
  EXECUTION_TIMEOUT_MS: "120000"
  WARMUP_TIMEOUT_SECONDS: "180"
  TOTAL_LIFECYCLE_SECONDS: "295"
  CLEANUP_RESERVE_SECONDS: "10"
  IDLE_TIMEOUT_SECONDS: "5"
  FIXTURE_EXPECTED_SHA256: "f4368b08487cfc366f049becbcbc63c7e2345808902021639e051b9c3e08cc1f"
  GFPGAN_SHA256: "e2cd4703ab14f4d01fd1383a8a8b266f9a5833dacee8e6a79d3bf21a1b6be5ad"
  GFPGAN_SIZE: "348632874"
  DETECTION_SHA256: "6d1de9c2944f2ccddca5f5e010ea5ae64a39845a86311af6fdf30841b0a5a16d"
  DETECTION_SIZE: "109497761"
  PARSING_SHA256: "3d558d8d0e42c20224f13cf5a29c79eba2d59913419f945545d8cf7b72920de2"
  PARSING_SIZE: "85331193"

jobs:
  gate3-canary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "EXECUTE_ONE_GATE3_CANARY" ]; then
            echo "ERROR: confirmation must be exactly EXECUTE_ONE_GATE3_CANARY"
            exit 1
          fi
          echo "Confirmation verified."

      - name: Checkout repo (for canonical fixture generator only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runpodctl (pinned release binary)
        run: |
          curl -fsSL -o /usr/local/bin/runpodctl \
            "https://github.com/runpod/runpodctl/releases/download/${RUNPODCTL_VERSION}/runpodctl-linux-amd64"
          chmod +x /usr/local/bin/runpodctl
          runpodctl version

      # ---------------------------------------------------------------
      # Preflight 1: origin/main includes the approved evidence commit
      # ---------------------------------------------------------------
      - name: "Preflight 1 - approved commit present on this ref"
        run: |
          if ! git merge-base --is-ancestor b72728ead5bacd741226c5b6005c4326a9906baf HEAD; then
            echo "ERROR: this ref does not include the approved evidence commit b72728e"
            exit 1
          fi
          echo "PASSED: b72728e is an ancestor of the dispatched ref"

      # ---------------------------------------------------------------
      # Preflight 2: image digest, volume/datacenter, and weight
      # size/SHA-256 all match the approved facts (no guessed values)
      # ---------------------------------------------------------------
      - name: "Preflight 2a - immutable image digest resolves (manifest only, no pull)"
        run: |
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" > manifest.txt
          cat manifest.txt
          grep -q "${IMAGE_DIGEST#sha256:}" manifest.txt || { echo "ERROR: resolved manifest does not match approved digest"; exit 1; }
          echo "PASSED: image resolves by exact approved digest"

      - name: "Preflight 2b - Network Volume exists in approved datacenter"
        run: |
          RESPONSE=$(curl -s -X GET https://rest.runpod.io/v1/networkvolumes \
            -H "Authorization: Bearer $RUNPOD_API_KEY")
          MATCH=$(echo "$RESPONSE" | jq --arg id "$NETWORK_VOLUME_ID" --arg dc "$TARGET_DATACENTER_ID" \
            '[.[] | select((.id // "" | startswith($id)) and .dataCenterId == $dc)] | length')
          if [ "$MATCH" != "1" ]; then
            echo "ERROR: expected exactly 1 Network Volume matching id prefix and datacenter, found $MATCH"
            exit 1
          fi
          echo "PASSED: Network Volume confirmed in ${TARGET_DATACENTER_ID}"

      - name: "Preflight 2c - remote weight sizes/SHA-256 match approved facts"
        run: |
          verify_remote() {
            local key="$1" expected_size="$2" expected_sha="$3"
            local remote_size verify_copy actual_sha
            remote_size=$(aws s3api head-object --bucket "$NETWORK_VOLUME_ID" --key "$key" --endpoint-url "$S3_ENDPOINT" --region "$AWS_DEFAULT_REGION" --query ContentLength --output text)
            test "$remote_size" = "$expected_size" || { echo "ERROR: $key size mismatch (remote=$remote_size expected=$expected_size)"; exit 1; }
            verify_copy="${RUNNER_TEMP}/$(basename "$key").verify"
            aws s3 cp "s3://${NETWORK_VOLUME_ID}/${key}" "$verify_copy" --endpoint-url "$S3_ENDPOINT" --region "$AWS_DEFAULT_REGION" --no-progress
            actual_sha=$(sha256sum "$verify_copy" | awk '{print $1}')
            rm -f "$verify_copy"
            test "$actual_sha" = "$expected_sha" || { echo "ERROR: $key SHA-256 mismatch"; exit 1; }
            echo "verified: $key size=$remote_size sha256=$actual_sha"
          }
          verify_remote "models/GFPGANv1.4.pth" "$GFPGAN_SIZE" "$GFPGAN_SHA256"
          verify_remote "models/facexlib/detection_Resnet50_Final.pth" "$DETECTION_SIZE" "$DETECTION_SHA256"
          verify_remote "models/facexlib/parsing_parsenet.pth" "$PARSING_SIZE" "$PARSING_SHA256"
          echo "PASSED: all three remote weights match approved size/SHA-256"

      # ---------------------------------------------------------------
      # Preflight 3: live RTX 4000 Ada availability in EU-RO-1
      # ---------------------------------------------------------------
      - name: "Preflight 3 - live GPU/datacenter co-location (runpodctl, read-only)"
        run: |
          runpodctl gpu list --include-unavailable -o json > gputypes.json
          MATCH_COUNT=$(jq -r --arg dc "$TARGET_DATACENTER_ID" --arg gpu "$TARGET_GPU_TYPE_ID" '
            [.[] | select((.displayName // "") | test("RTX 4000 Ada"; "i"))
             | (.dataCenterAvailability // [])[] | select(.dataCenterId == $dc)] | length' gputypes.json)
          echo "Live dataCenterAvailability entries matching fixed target: ${MATCH_COUNT}"
          if [ "$MATCH_COUNT" = "0" ]; then
            echo "ERROR: live evidence does not confirm ${TARGET_GPU_TYPE_ID} availability in ${TARGET_DATACENTER_ID}"
            exit 1
          fi
          echo "PASSED: live evidence confirms GPU availability in the approved datacenter"

      # ---------------------------------------------------------------
      # Preflight 4/5: rate ceiling and worst-case budget guard.
      # No RunPod REST or runpodctl field exposes a live per-second
      # Serverless Flex billing rate (confirmed: rest.runpod.io/v1/openapi.json
      # has no such field; runpodctl gpu list only returns Pod
      # securePricePerHr/communityPricePerHr, not Serverless Flex pricing).
      # FLEX_RATE_CEILING_USD_PER_SEC is therefore the fixed, explicitly
      # user-approved ceiling, not a live-queried value. Actual billed cost
      # is independently captured post-execution and re-checked against
      # COMPUTE_BUDGET_USD before this job is reported successful.
      # ---------------------------------------------------------------
      - name: "Preflight 4/5 - rate ceiling and worst-case budget guard"
        run: |
          WORST_CASE=$(echo "$TOTAL_LIFECYCLE_SECONDS * $RATE_CEILING_USD_PER_SECOND" | bc -l)
          echo "Fixed rate ceiling: \$${RATE_CEILING_USD_PER_SECOND}/second"
          echo "Total lifecycle ceiling: ${TOTAL_LIFECYCLE_SECONDS}s"
          echo "Estimated maximum lifecycle cost: \$${WORST_CASE}"
          echo "Authorized compute budget: \$${BUDGET_USD}"
          if (( $(echo "$WORST_CASE > $BUDGET_USD" | bc -l) )); then
            echo "ERROR: worst-case projected cost exceeds the authorized \$${BUDGET_USD} budget"
            exit 1
          fi
          test "$TOTAL_LIFECYCLE_SECONDS" = "295"
          test "$CLEANUP_RESERVE_SECONDS" = "10"
          test "$WARMUP_TIMEOUT_SECONDS" = "180"
          echo "PASSED: 295 x 0.00016 = 0.0472 <= 0.05"

      # ---------------------------------------------------------------
      # Preflight 6: fixed template/endpoint names must not already exist
      # ---------------------------------------------------------------
      - name: "Preflight 6 - fixed template/endpoint names are free"
        run: |
          TEMPLATES=$(curl -s -X GET https://rest.runpod.io/v1/templates -H "Authorization: Bearer $RUNPOD_API_KEY")
          if echo "$TEMPLATES" | jq -e --arg n "$TEMPLATE_NAME" '[.[] | select(.name == $n)] | length > 0' >/dev/null 2>&1; then
            echo "ERROR: template ${TEMPLATE_NAME} already exists"
            exit 1
          fi
          ENDPOINTS=$(curl -s -X GET https://rest.runpod.io/v1/endpoints -H "Authorization: Bearer $RUNPOD_API_KEY")
          if echo "$ENDPOINTS" | jq -e --arg n "$ENDPOINT_NAME" '[.[] | select(.name == $n)] | length > 0' >/dev/null 2>&1; then
            echo "ERROR: endpoint ${ENDPOINT_NAME} already exists"
            exit 1
          fi
          echo "PASSED: neither fixed name exists"

      # ---------------------------------------------------------------
      # Regenerate and verify the canonical synthetic fixture
      # ---------------------------------------------------------------
      - name: Regenerate and verify canonical synthetic fixture
        run: |
          python3 docs/restoration/fixtures/gen_canary_face_fixture.py --out "${RUNNER_TEMP}/canary.png"
          ACTUAL=$(sha256sum "${RUNNER_TEMP}/canary.png" | awk '{print $1}')
          test "$ACTUAL" = "$FIXTURE_EXPECTED_SHA256" || { echo "ERROR: fixture SHA-256 drift"; exit 1; }
          echo "PASSED: canonical fixture verified, sha256=${ACTUAL}"

      # ---------------------------------------------------------------
      # Create exactly one private Serverless template (single POST)
      # ---------------------------------------------------------------
      - name: "Create template (POST /v1/templates, exactly once)"
        id: create-template
        run: |
          # TORCH_FORCE_WEIGHTS_ONLY_LOAD=1 is already baked into the published
          # image's Config.Env (verified 2026-08-01 via anonymous GHCR manifest
          # inspection of digest ${IMAGE_DIGEST}) and is inherited by the
          # handler's subprocess by default (handler.py's subprocess.run call
          # passes no env= override). Root-cause analysis CONTRADICTED the
          # hypothesis that an empty template env caused run 30691401701's
          # failure. This explicit template env is defense-in-depth only: it
          # is the one required, proven, non-secret runtime value and nothing
          # else -- no credentials, provider keys, or production variables.
          PAYLOAD=$(jq -n --arg name "$TEMPLATE_NAME" --arg image "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" '{
            "name": $name,
            "imageName": $image,
            "isServerless": true,
            "isPublic": false,
            "category": "NVIDIA",
            "containerDiskInGb": 20,
            "ports": [],
            "env": { "TORCH_FORCE_WEIGHTS_ONLY_LOAD": "1" }
          }')
          RESPONSE=$(curl -s -X POST https://rest.runpod.io/v1/templates \
            -H "Content-Type: application/json" -H "Authorization: Bearer $RUNPOD_API_KEY" -d "$PAYLOAD")
          TEMPLATE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$TEMPLATE_ID" ]; then
            echo "ERROR: template creation failed"
            echo "$RESPONSE" | jq 'del(.id)' 2>/dev/null || true
            exit 1
          fi
          echo "template_id=${TEMPLATE_ID}" >> "$GITHUB_OUTPUT"
          echo "template_env=$(echo "$RESPONSE" | jq -c '.env // {}')" >> "$GITHUB_OUTPUT"
          echo "Template created (redacted): ${TEMPLATE_ID:0:6}..."

      - name: "Pre-submit assertion - template response contains intended env"
        run: |
          ENV_JSON='${{ steps.create-template.outputs.template_env }}'
          echo "Template response env (non-secret): ${ENV_JSON}"
          ACTUAL=$(echo "$ENV_JSON" | jq -r '.TORCH_FORCE_WEIGHTS_ONLY_LOAD // empty')
          if [ "$ACTUAL" != "1" ]; then
            echo "ERROR: template response env does not confirm TORCH_FORCE_WEIGHTS_ONLY_LOAD=1 (got: '${ACTUAL}')"
            exit 1
          fi
          KEY_COUNT=$(echo "$ENV_JSON" | jq 'keys | length')
          if [ "$KEY_COUNT" != "1" ]; then
            echo "ERROR: template env must contain exactly one key (TORCH_FORCE_WEIGHTS_ONLY_LOAD); found ${KEY_COUNT}"
            exit 1
          fi
          echo "PASSED: template response confirms the intended, minimal, non-secret env configuration"

      # ---------------------------------------------------------------
      # Create exactly one queue endpoint (single POST)
      # ---------------------------------------------------------------
      - name: "Create endpoint (POST /v1/endpoints, exactly once)"
        id: create-endpoint
        run: |
          # FlashBoot (rest.runpod.io/v1/openapi.json: EndpointCreateInput.flashboot,
          # boolean) is requested explicitly here as defense-in-depth, even though
          # RunPod's docs state new endpoints already have it enabled by default.
          # Per official guidance (docs.runpod.io/serverless/endpoints/endpoint-
          # configurations): FlashBoot "reduces cold starts by retaining worker
          # state after spin-down, allowing faster revival than fresh boots" -- it
          # is most effective on endpoints with consistent traffic where workers
          # cycle between active and idle. It does NOT guarantee a fast first boot
          # for a brand-new endpoint's very first worker, which is exactly this
          # canary's situation. workersMin=1 (active worker) is what removes
          # REQUEST-TIME cold starts once the worker reaches ready; the one-time
          # initial image/model initialization before that point still occurs and
          # is still billable, and is exactly what the bounded warm-worker step
          # below measures and bounds.
          PAYLOAD=$(jq -n \
            --arg name "$ENDPOINT_NAME" \
            --arg templateId "${{ steps.create-template.outputs.template_id }}" \
            --arg gpu "$TARGET_GPU_TYPE_ID" \
            --arg dc "$TARGET_DATACENTER_ID" \
            --arg vol "$NETWORK_VOLUME_ID" \
            --argjson idle "$IDLE_TIMEOUT_SECONDS" \
            --argjson timeoutMs "$EXECUTION_TIMEOUT_MS" \
            '{
              "name": $name,
              "templateId": $templateId,
              "computeType": "GPU",
              "gpuTypeIds": [$gpu],
              "gpuCount": 1,
              "dataCenterIds": [$dc],
              "networkVolumeId": $vol,
              "workersMin": 1,
              "workersMax": 1,
              "idleTimeout": $idle,
              "executionTimeoutMs": $timeoutMs,
              "scalerType": "QUEUE_DELAY",
              "flashboot": true
            }')
          RESPONSE=$(curl -s -X POST https://rest.runpod.io/v1/endpoints \
            -H "Content-Type: application/json" -H "Authorization: Bearer $RUNPOD_API_KEY" -d "$PAYLOAD")
          ENDPOINT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$ENDPOINT_ID" ]; then
            echo "ERROR: endpoint creation failed"
            echo "$RESPONSE" | jq 'del(.id)' 2>/dev/null || true
            exit 1
          fi

          # The documented Endpoint response schema (rest.runpod.io/v1/openapi.json)
          # has NO "flashboot" property at all -- confirmed by direct schema
          # inspection, not memory. Its omission from the response is therefore
          # structurally expected and must never be treated as flashboot=false.
          # jq's "//" operator collapses both null and false to the same
          # fallback, so an explicit "== null" check is used instead to avoid
          # silently mapping a real "false" response into "null".
          FLASHBOOT_CONFIRMED=$(echo "$RESPONSE" | jq -r 'if .flashboot == null then "null" else (.flashboot | tostring) end')
          if [ "$FLASHBOOT_CONFIRMED" = "false" ]; then
            echo "ERROR: endpoint response explicitly confirms flashboot=false despite requesting true" >&2
            exit 1
          fi
          echo "flashboot_requested=true" >> "$GITHUB_OUTPUT"
          echo "flashboot_confirmed=${FLASHBOOT_CONFIRMED}" >> "$GITHUB_OUTPUT"
          echo "endpoint_id=${ENDPOINT_ID}" >> "$GITHUB_OUTPUT"
          echo "endpoint_created_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "lifecycle_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Endpoint created (redacted): ${ENDPOINT_ID:0:6}..."
          echo "flashbootRequested=true flashbootConfirmed=${FLASHBOOT_CONFIRMED} (null means the documented response schema omits this optional field, not that flashboot is disabled)"
          echo "gpuCount=1 concurrency/maxJobs/maxRetries are enforced by this workflow submitting exactly one job and never retrying (RunPod's Serverless REST API has no literal concurrency/maxJobs/maxRetries endpoint-creation fields; concurrency is a handler-side setting unused here since only one job is ever submitted)."

      # ---------------------------------------------------------------
      # Warm-up is distinct from executionTimeoutMs. A worker may be billable
      # while initializing; this bounded window submits no job until ready.
      # ---------------------------------------------------------------
      - name: "Warm worker before job submission (bounded, no job on timeout)"
        id: warm-worker
        run: |
          ENDPOINT_ID="${{ steps.create-endpoint.outputs.endpoint_id }}"
          START="${{ steps.create-endpoint.outputs.lifecycle_start_epoch }}"
          TRANSITIONS=""
          FIRST_INITIALIZING_EPOCH=""
          FIRST_READY_EPOCH=""
          while :; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START ))
            if [ "$ELAPSED" -ge "$WARMUP_TIMEOUT_SECONDS" ]; then
              echo "warmup_elapsed_seconds=${ELAPSED}" >> "$GITHUB_OUTPUT"
              echo "worker_state_transitions=${TRANSITIONS}" >> "$GITHUB_OUTPUT"
              echo "first_initializing_timestamp=${FIRST_INITIALIZING_EPOCH:-null}" >> "$GITHUB_OUTPUT"
              echo "first_ready_timestamp=${FIRST_READY_EPOCH:-null}" >> "$GITHUB_OUTPUT"
              echo "job_submitted=false" >> "$GITHUB_OUTPUT"
              echo "cancellation_reason=warmup_timeout_no_job" >> "$GITHUB_OUTPUT"
              echo "ERROR: worker did not become ready before warm-up timeout; submitting zero jobs"
              exit 1
            fi
            HEALTH=$(curl -s -X GET "https://api.runpod.ai/v2/${ENDPOINT_ID}/health" -H "Authorization: Bearer $RUNPOD_API_KEY")
            READY=$(echo "$HEALTH" | jq -r '.workers.ready // 0')
            INITIALIZING=$(echo "$HEALTH" | jq -r '.workers.initializing // 0')
            STATE="ready=${READY},initializing=${INITIALIZING}"
            TRANSITIONS="${TRANSITIONS}${TRANSITIONS:+;}${ELAPSED}s:${STATE}"
            if [ -z "$FIRST_INITIALIZING_EPOCH" ] && [ "$INITIALIZING" -ge 1 ]; then
              FIRST_INITIALIZING_EPOCH="$NOW"
            fi
            if [ -z "$FIRST_READY_EPOCH" ] && [ "$READY" -ge 1 ]; then
              FIRST_READY_EPOCH="$NOW"
            fi
            echo "warmup elapsed=${ELAPSED}s ${STATE}"
            if [ "$READY" -ge 1 ] && [ "$INITIALIZING" = "0" ]; then
              REMAINING=$(( TOTAL_LIFECYCLE_SECONDS - ELAPSED - CLEANUP_RESERVE_SECONDS ))
              if [ "$REMAINING" -lt 30 ]; then
                echo "warmup_elapsed_seconds=${ELAPSED}" >> "$GITHUB_OUTPUT"
                echo "worker_state_transitions=${TRANSITIONS}" >> "$GITHUB_OUTPUT"
                echo "first_initializing_timestamp=${FIRST_INITIALIZING_EPOCH:-null}" >> "$GITHUB_OUTPUT"
                echo "first_ready_timestamp=${FIRST_READY_EPOCH:-null}" >> "$GITHUB_OUTPUT"
                echo "job_submitted=false" >> "$GITHUB_OUTPUT"
                echo "cancellation_reason=insufficient_lifecycle_before_cleanup" >> "$GITHUB_OUTPUT"
                echo "ERROR: fewer than 30 seconds remain before cleanup reserve; submitting zero jobs"
                exit 1
              fi
              echo "warmup_elapsed_seconds=${ELAPSED}" >> "$GITHUB_OUTPUT"
              echo "worker_state_transitions=${TRANSITIONS}" >> "$GITHUB_OUTPUT"
              echo "first_initializing_timestamp=${FIRST_INITIALIZING_EPOCH:-null}" >> "$GITHUB_OUTPUT"
              echo "first_ready_timestamp=${FIRST_READY_EPOCH:-null}" >> "$GITHUB_OUTPUT"
              echo "job_submitted=false" >> "$GITHUB_OUTPUT"
              echo "cancellation_reason=" >> "$GITHUB_OUTPUT"
              echo "PASSED: warm worker ready with ${REMAINING}s available before cleanup reserve"
              exit 0
            fi
            sleep 3
          done

      # ---------------------------------------------------------------
      # Submit exactly one restore job (single POST, inline base64, no URL).
      # Only runs if the warm-worker step above exited 0 (worker ready with
      # sufficient remaining lifecycle); never runs on warm-up timeout.
      # ---------------------------------------------------------------
      - name: "Submit exactly one restore job"
        id: submit-job
        if: success()
        run: |
          # The base64 fixture (~1MB) exceeds the kernel's single-argument
          # length limit (MAX_ARG_STRLEN, 128KB on Linux), so it must never be
          # passed as a jq/curl command-line argument. It is written to a file
          # and read via jq --rawfile / curl --data-binary @file instead.
          base64 -w0 "${RUNNER_TEMP}/canary.png" > "${RUNNER_TEMP}/canary.b64"
          jq -n --rawfile img "${RUNNER_TEMP}/canary.b64" --argjson timeoutMs "$EXECUTION_TIMEOUT_MS" '{
            "input": { "mode": "restore", "imageBase64": $img },
            "policy": { "executionTimeout": $timeoutMs }
          }' > "${RUNNER_TEMP}/job_payload.json"
          RESPONSE=$(curl -s -X POST "https://api.runpod.ai/v2/${{ steps.create-endpoint.outputs.endpoint_id }}/run" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $RUNPOD_API_KEY" --data-binary "@${RUNNER_TEMP}/job_payload.json")
          rm -f "${RUNNER_TEMP}/canary.b64" "${RUNNER_TEMP}/job_payload.json"
          JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$JOB_ID" ]; then
            echo "ERROR: job submission failed"
            echo "$RESPONSE" | jq 'del(.id)' 2>/dev/null || true
            exit 1
          fi
          echo "job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"
          echo "job_submitted=true" >> "$GITHUB_OUTPUT"
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Job submitted (redacted): ${JOB_ID:0:8}..."

      # ---------------------------------------------------------------
      # Poll status until terminal state, execution limit, or the lifecycle
      # deadline minus cleanup reserve, whichever happens first.
      # No retry/resubmit: this is the one and only /run call above.
      # ---------------------------------------------------------------
      - name: "Poll job status (cancel at execution/lifecycle limit, never resubmit)"
        id: poll-job
        if: success()
        run: |
          JOB_ID="${{ steps.submit-job.outputs.job_id }}"
          ENDPOINT_ID="${{ steps.create-endpoint.outputs.endpoint_id }}"
          START="${{ steps.submit-job.outputs.start_epoch }}"
          LIFECYCLE_START="${{ steps.create-endpoint.outputs.lifecycle_start_epoch }}"
          STATUS="IN_QUEUE"
          RESULT="{}"
          while :; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START ))
            RESULT=$(curl -s -X GET "https://api.runpod.ai/v2/${ENDPOINT_ID}/status/${JOB_ID}" \
              -H "Authorization: Bearer $RUNPOD_API_KEY")
            STATUS=$(echo "$RESULT" | jq -r '.status // "UNKNOWN"')
            echo "elapsed=${ELAPSED}s status=${STATUS}"
            if [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              break
            fi
            LIFECYCLE_ELAPSED=$(( NOW - LIFECYCLE_START ))
            EXECUTION_LIMIT_SECONDS=$(( EXECUTION_TIMEOUT_MS / 1000 ))
            DEADLINE_LIMIT=$(( TOTAL_LIFECYCLE_SECONDS - CLEANUP_RESERVE_SECONDS ))
            if [ "$ELAPSED" -ge "$EXECUTION_LIMIT_SECONDS" ] || [ "$LIFECYCLE_ELAPSED" -ge "$DEADLINE_LIMIT" ]; then
              REASON=execution_timeout
              if [ "$LIFECYCLE_ELAPSED" -ge "$DEADLINE_LIMIT" ]; then REASON=lifecycle_deadline_before_cleanup; fi
              echo "Cancellation limit reached: ${REASON}; cancelling job (no resubmit)"
              curl -s -X POST "https://api.runpod.ai/v2/${ENDPOINT_ID}/cancel/${JOB_ID}" \
                -H "Authorization: Bearer $RUNPOD_API_KEY" > /tmp/cancel.json
              STATUS=$(jq -r '.status // "CANCELLED"' /tmp/cancel.json)
              echo "cancellation_reason=${REASON}" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 3
          done
          END=$(date +%s)
          echo "$RESULT" > "${RUNNER_TEMP}/job_result.json"
          echo "final_status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "end_epoch=${END}" >> "$GITHUB_OUTPUT"
          echo "billed_duration_seconds=$(( END - START ))" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Capture evidence: decode output, verify it, derive contract fields.
      # if: always() so this step also runs -- and reports honest, bounded
      # diagnostics -- when the warm-worker step never let a job be
      # submitted (warm-up timeout or insufficient remaining lifecycle).
      # It always exits 0 itself; the Success gate step below is what
      # actually fails the run when criteria are not met.
      # ---------------------------------------------------------------
      - name: Capture and verify evidence
        id: evidence
        if: always()
        run: |
          JOB_SUBMITTED="${{ steps.submit-job.outputs.job_submitted }}"
          if [ "$JOB_SUBMITTED" != "true" ]; then
            # No job was ever submitted: warm-up timed out or insufficient
            # remaining lifecycle before the cleanup reserve. Report the
            # warm-worker step's own bounded diagnostics; do not fabricate
            # job-shaped fields, and do not try to read a job_result.json
            # that was never written.
            CANCELLATION_REASON="${{ steps.warm-worker.outputs.cancellation_reason }}"
            WARMUP_ELAPSED="${{ steps.warm-worker.outputs.warmup_elapsed_seconds }}"
            STATE_TRANSITIONS="${{ steps.warm-worker.outputs.worker_state_transitions }}"
            FIRST_INITIALIZING_TS="${{ steps.warm-worker.outputs.first_initializing_timestamp }}"
            FIRST_READY_TS="${{ steps.warm-worker.outputs.first_ready_timestamp }}"
            REASON_LABEL="${CANCELLATION_REASON:-unknown}"
            ESTIMATED_COST=$(echo "scale=6; ${WARMUP_ELAPSED:-0} * $RATE_CEILING_USD_PER_SECOND" | bc -l)
            {
              echo "status=NO_JOB_${REASON_LABEL}"
              echo "ok=false"
              echo "gpu="
              echo "gpu_inference_executed=false"
              echo "provider_post_count=-1"
              echo "production_routing_allowed=null"
              echo "configured_production_routing_allowed=false"
              echo "output_width=0"
              echo "output_height=0"
              echo "output_format="
              echo "output_bytes=0"
              echo "output_decoded_bytes=0"
              echo "output_bytes_match=false"
              echo "output_sha256="
              echo "producer_sha256="
              echo "producer_hash_match=false"
              echo "output_base64_length=0"
              echo "output_base64_length_mod4=0"
              echo "first8_decoded_bytes_hex="
              echo "png_signature_match=false"
              echo "byte_classification=no_job_submitted"
              echo "output_decodable=false"
              echo "delay_ms=0"
              echo "execution_ms=0"
              echo "actual_cost_usd=${ESTIMATED_COST}"
              echo "output_is_json=false"
              echo "error_msg="
              echo "error_detail=no job was submitted: ${REASON_LABEL}"
              echo "warmup_elapsed_seconds=${WARMUP_ELAPSED:-0}"
              echo "worker_state_transitions=${STATE_TRANSITIONS:-}"
              echo "cancellation_reason=${CANCELLATION_REASON:-}"
              echo "flashboot_requested=${{ steps.create-endpoint.outputs.flashboot_requested }}"
              echo "flashboot_confirmed=${{ steps.create-endpoint.outputs.flashboot_confirmed }}"
              echo "endpoint_created_epoch=${{ steps.create-endpoint.outputs.endpoint_created_epoch }}"
              echo "first_initializing_timestamp=${FIRST_INITIALIZING_TS:-null}"
              echo "first_ready_timestamp=${FIRST_READY_TS:-null}"
              echo "total_warmup_elapsed_seconds=${WARMUP_ELAPSED:-0}"
            } >> "$GITHUB_OUTPUT"
            {
              echo "sanitized_output<<GATE3_EOF"
              echo "{}"
              echo "GATE3_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "=== Gate 3 canary evidence (redacted): NO JOB SUBMITTED ==="
            echo "cancellationReason=${REASON_LABEL} warmupElapsedSeconds=${WARMUP_ELAPSED:-0} estimatedCostUsd=${ESTIMATED_COST}"
            echo "workerStateTransitions=${STATE_TRANSITIONS:-}"
            exit 0
          fi

          RESULT_FILE="${RUNNER_TEMP}/job_result.json"
          STATUS="${{ steps.poll-job.outputs.final_status }}"
          echo "job_status=${STATUS}"

          OK=$(jq -r '.output.ok // false' "$RESULT_FILE" 2>/dev/null || echo false)
          GPU=$(jq -r '.output.gpu // ""' "$RESULT_FILE" 2>/dev/null || echo "")
          WEIGHT_VERIFIED=$(jq -r '.output.weightVerified // false' "$RESULT_FILE" 2>/dev/null || echo false)
          PROVIDER_POST_COUNT=$(jq -r '.output.providerPostCount // -1' "$RESULT_FILE" 2>/dev/null || echo -1)
          # NOTE: jq's `//` operator treats JSON `false` as falsy, so a naive
          # `.output.productionRoutingAllowed // "null"` silently rewrites an
          # explicit `false` into the string "null", indistinguishable from a
          # missing field. Use explicit value comparisons instead so true/
          # false/null are each preserved exactly, and only a genuinely
          # missing/null field collapses to "null".
          PRODUCTION_ROUTING=$(jq -r 'if .output == null then "null" else (.output.productionRoutingAllowed | if . == null then "null" elif . == true then "true" elif . == false then "false" else (. | tostring) end) end' "$RESULT_FILE" 2>/dev/null || echo null)
          OUT_W=$(jq -r '.output.outputWidth // 0' "$RESULT_FILE" 2>/dev/null || echo 0)
          OUT_H=$(jq -r '.output.outputHeight // 0' "$RESULT_FILE" 2>/dev/null || echo 0)
          OUT_FMT=$(jq -r '.output.outputFormat // ""' "$RESULT_FILE" 2>/dev/null || echo "")
          OUT_BYTES=$(jq -r '.output.outputBytes // 0' "$RESULT_FILE" 2>/dev/null || echo 0)
          DELAY_MS=$(jq -r '.delayTime // 0' "$RESULT_FILE" 2>/dev/null || echo 0)
          EXEC_MS=$(jq -r '.executionTime // 0' "$RESULT_FILE" 2>/dev/null || echo 0)

          # Sanitized failure diagnostics, captured before mandatory cleanup
          # deletes the job/worker/endpoint. RunPod's job status API exposes
          # no stdout/stderr endpoint (confirmed against docs.runpod.io and
          # rest.runpod.io/v1/openapi.json) -- only the handler's own JSON
          # output/error fields are available, so that limitation is
          # documented rather than inventing a log endpoint that does not
          # exist. Every value here is bounded to a small fixed character
          # limit and never includes outputBase64 or any credential.
          OUTPUT_IS_JSON=$(jq -e '.output != null' "$RESULT_FILE" >/dev/null 2>&1 && echo true || echo false)
          ERROR_MSG=$(jq -r '.output.error // ""' "$RESULT_FILE" 2>/dev/null | cut -c1-200)
          ERROR_DETAIL=$(jq -r '.output.detail // ""' "$RESULT_FILE" 2>/dev/null | cut -c1-200)
          SANITIZED_OUTPUT=$(jq -c '(.output // {}) | del(.outputBase64)' "$RESULT_FILE" 2>/dev/null | cut -c1-500)

          # gpu_inference_executed: the published worker raises a fail-closed
          # CUDA error before returning ok=true in restore mode, so ok=true
          # with a non-empty device name is proof CUDA/GPU inference ran.
          GPU_INFERENCE_EXECUTED=false
          if [ "$OK" = "true" ] && [ -n "$GPU" ] && [ "$WEIGHT_VERIFIED" = "true" ]; then
            GPU_INFERENCE_EXECUTED=true
          fi

          # Decode and independently verify the output image if present.
          #
          # DIAGNOSTIC NOTE (added after run 30708733953, where independent
          # PNG decoding failed and the original artifact was not retained
          # for postmortem): the decoded file's actual byte count is compared
          # against the handler's own `outputBytes` metadata below. A
          # mismatch here narrows the failure mode for any future occurrence
          # (e.g. a decoded size far larger than outputBytes is consistent
          # with base64 double-encoding somewhere in the pipeline; a decoded
          # size smaller than outputBytes, with a `base64: invalid input`
          # decode error, is consistent with payload truncation). This check
          # is purely diagnostic -- it does not change success/failure
          # semantics, which remain governed by independent PNG decoding.
          OUT_SHA256=""
          DECODABLE=false
          DECODED_BYTES=0
          OUTPUT_BYTES_MATCH=false
          PRODUCER_SHA256=""
          PRODUCER_HASH_MATCH=false
          B64_LENGTH=0
          B64_LENGTH_MOD4=0
          FIRST8_HEX=""
          PNG_SIGNATURE_MATCH=false
          BYTE_CLASSIFICATION="not_evaluated"

          # Producer-reported output hash, if the handler contract supplies one.
          # Extracted with an explicit null-check (never a `//` fallback, which
          # would conflate an explicit empty/false value with absence).
          PRODUCER_SHA256=$(jq -r 'if .output == null then "" else (.output.outputSha256 // .output.outputSHA256 // "" ) end' "$RESULT_FILE" 2>/dev/null || echo "")

          # Base64 payload shape: LENGTH ONLY. The base64 string itself is never
          # printed, logged, uploaded, or written to any artifact -- only its
          # character count and length-mod-4, which are sufficient to detect
          # padding/truncation anomalies without exposing image content.
          B64_LENGTH=$(jq -r '.output.outputBase64 // empty' "$RESULT_FILE" 2>/dev/null | tr -d '\n' | wc -c | tr -d ' ')
          B64_LENGTH=${B64_LENGTH:-0}
          B64_LENGTH_MOD4=$(( B64_LENGTH % 4 ))

          if [ "$OK" = "true" ]; then
            jq -r '.output.outputBase64 // empty' "$RESULT_FILE" | base64 -d > "${RUNNER_TEMP}/canary_out.png" 2>/dev/null || true
            if [ -s "${RUNNER_TEMP}/canary_out.png" ]; then
              python3 -c "from PIL import Image; Image.open('${RUNNER_TEMP}/canary_out.png').verify()" 2>/dev/null && DECODABLE=true || DECODABLE=false
              OUT_SHA256=$(sha256sum "${RUNNER_TEMP}/canary_out.png" | awk '{print $1}')
              DECODED_BYTES=$(wc -c < "${RUNNER_TEMP}/canary_out.png" | tr -d ' ')
              if [ "$DECODED_BYTES" = "$OUT_BYTES" ]; then
                OUTPUT_BYTES_MATCH=true
              fi
              if [ -n "$PRODUCER_SHA256" ] && [ "$PRODUCER_SHA256" = "$OUT_SHA256" ]; then
                PRODUCER_HASH_MATCH=true
              fi
              # First 8 decoded bytes as hex; the PNG magic is 89504e470d0a1a0a.
              FIRST8_HEX=$(head -c 8 "${RUNNER_TEMP}/canary_out.png" | od -An -tx1 | tr -d ' \n')
              if [ "$FIRST8_HEX" = "89504e470d0a1a0a" ]; then
                PNG_SIGNATURE_MATCH=true
              fi
            fi

            # Evidence-bounded classification of the byte-level outcome. These
            # branches restate only what the measured numbers show; they do not
            # speculate beyond the evidence, and they never alter the success
            # gate (which is governed by the independent checks below).
            if [ "$DECODED_BYTES" = "0" ]; then
              BYTE_CLASSIFICATION="no_decoded_output"
            elif [ "$DECODED_BYTES" -gt "$OUT_BYTES" ] 2>/dev/null; then
              BYTE_CLASSIFICATION="likely_double_encoding"
            elif [ "$DECODED_BYTES" -lt "$OUT_BYTES" ] 2>/dev/null; then
              BYTE_CLASSIFICATION="likely_truncation"
            elif [ "$OUTPUT_BYTES_MATCH" = "true" ] && [ "$DECODABLE" = "true" ] && [ "$PNG_SIGNATURE_MATCH" = "true" ]; then
              BYTE_CLASSIFICATION="success_bytes_verified"
            elif [ "$OUTPUT_BYTES_MATCH" = "true" ] && [ "$DECODABLE" != "true" ]; then
              BYTE_CLASSIFICATION="producer_generated_invalid_png_or_metadata_inconsistency"
            else
              BYTE_CLASSIFICATION="indeterminate"
            fi
          fi

          # Actual compute cost: RunPod's job status API exposes no literal
          # per-job cost field (confirmed against docs.runpod.io response
          # examples: delayTime/executionTime/id/output/status only). Actual
          # cost is computed from the billed executionTime at the fixed
          # approved rate ceiling, which is a conservative (upper-bound)
          # estimate, and is cross-checked against COMPUTE_BUDGET_USD below.
          ACTUAL_COST=$(echo "scale=6; ($EXEC_MS/1000) * $RATE_CEILING_USD_PER_SECOND" | bc -l)

          # Sanitized diagnostic metadata artifact. Contains ONLY the bounded
          # numeric/hash/boolean fields below -- never base64, never the input
          # image, never a secret/token, never a raw authenticated response,
          # never a weight, never an environment dump. Values are passed via
          # explicit EV_* variables (not a blanket environment dump).
          EV_STATUS="$STATUS" \
          EV_OUT_BYTES="$OUT_BYTES" \
          EV_PRODUCER_SHA256="$PRODUCER_SHA256" \
          EV_B64_LENGTH="$B64_LENGTH" \
          EV_B64_LENGTH_MOD4="$B64_LENGTH_MOD4" \
          EV_DECODED_BYTES="$DECODED_BYTES" \
          EV_OUT_SHA256="$OUT_SHA256" \
          EV_OUTPUT_BYTES_MATCH="$OUTPUT_BYTES_MATCH" \
          EV_PRODUCER_HASH_MATCH="$PRODUCER_HASH_MATCH" \
          EV_FIRST8_HEX="$FIRST8_HEX" \
          EV_PNG_SIGNATURE_MATCH="$PNG_SIGNATURE_MATCH" \
          EV_DECODABLE="$DECODABLE" \
          EV_BYTE_CLASSIFICATION="$BYTE_CLASSIFICATION" \
          EV_OUT_W="$OUT_W" \
          EV_OUT_H="$OUT_H" \
          EV_OUT_FMT="$OUT_FMT" \
          EV_PRODUCTION_ROUTING="$PRODUCTION_ROUTING" \
          EV_PROVIDER_POST_COUNT="$PROVIDER_POST_COUNT" \
          EV_GPU="$GPU" \
          EV_GPU_INFERENCE_EXECUTED="$GPU_INFERENCE_EXECUTED" \
          EV_DELAY_MS="$DELAY_MS" \
          EV_EXEC_MS="$EXEC_MS" \
          EV_WARMUP_ELAPSED="${{ steps.warm-worker.outputs.warmup_elapsed_seconds }}" \
          EV_ACTUAL_COST="$ACTUAL_COST" \
          python3 - "$RUNNER_TEMP/canary_output_metadata.json" <<'PYEOF'
          import json, os, sys
          meta = {
              "runId": os.environ.get("GITHUB_RUN_ID", ""),
              "imageDigest": os.environ.get("IMAGE_DIGEST", ""),
              "jobStatus": os.environ.get("EV_STATUS", ""),
              "producerOutputBytes": os.environ.get("EV_OUT_BYTES", ""),
              "producerOutputSha256": os.environ.get("EV_PRODUCER_SHA256", ""),
              "outputBase64Length": os.environ.get("EV_B64_LENGTH", ""),
              "outputBase64LengthMod4": os.environ.get("EV_B64_LENGTH_MOD4", ""),
              "decodedByteCount": os.environ.get("EV_DECODED_BYTES", ""),
              "decodedSha256": os.environ.get("EV_OUT_SHA256", ""),
              "outputBytesMatch": os.environ.get("EV_OUTPUT_BYTES_MATCH", ""),
              "producerHashMatch": os.environ.get("EV_PRODUCER_HASH_MATCH", ""),
              "first8DecodedBytesHex": os.environ.get("EV_FIRST8_HEX", ""),
              "pngSignatureExpected": "89504e470d0a1a0a",
              "pngSignatureMatch": os.environ.get("EV_PNG_SIGNATURE_MATCH", ""),
              "pillowVerifyPassed": os.environ.get("EV_DECODABLE", ""),
              "byteClassification": os.environ.get("EV_BYTE_CLASSIFICATION", ""),
              "outputWidth": os.environ.get("EV_OUT_W", ""),
              "outputHeight": os.environ.get("EV_OUT_H", ""),
              "outputFormat": os.environ.get("EV_OUT_FMT", ""),
              "productionRoutingAllowed": os.environ.get("EV_PRODUCTION_ROUTING", ""),
              "configuredProductionRoutingAllowed": "false",
              "providerPostCount": os.environ.get("EV_PROVIDER_POST_COUNT", ""),
              "gpu": os.environ.get("EV_GPU", ""),
              "gpuInferenceExecuted": os.environ.get("EV_GPU_INFERENCE_EXECUTED", ""),
              "delayMs": os.environ.get("EV_DELAY_MS", ""),
              "executionMs": os.environ.get("EV_EXEC_MS", ""),
              "warmupElapsedSeconds": os.environ.get("EV_WARMUP_ELAPSED", ""),
              "actualCostUsd": os.environ.get("EV_ACTUAL_COST", ""),
          }
          with open(sys.argv[1], "w") as f:
              json.dump(meta, f, indent=2, sort_keys=True)
          print("wrote sanitized metadata artifact (no base64/secret/weight content)")
          PYEOF

          {
            echo "status=${STATUS}"
            echo "ok=${OK}"
            echo "gpu=${GPU}"
            echo "gpu_inference_executed=${GPU_INFERENCE_EXECUTED}"
            echo "provider_post_count=${PROVIDER_POST_COUNT}"
            echo "production_routing_allowed=${PRODUCTION_ROUTING}"
            echo "output_width=${OUT_W}"
            echo "output_height=${OUT_H}"
            echo "output_format=${OUT_FMT}"
            echo "output_bytes=${OUT_BYTES}"
            echo "output_decoded_bytes=${DECODED_BYTES}"
            echo "output_bytes_match=${OUTPUT_BYTES_MATCH}"
            echo "output_sha256=${OUT_SHA256}"
            echo "producer_sha256=${PRODUCER_SHA256}"
            echo "producer_hash_match=${PRODUCER_HASH_MATCH}"
            echo "output_base64_length=${B64_LENGTH}"
            echo "output_base64_length_mod4=${B64_LENGTH_MOD4}"
            echo "first8_decoded_bytes_hex=${FIRST8_HEX}"
            echo "png_signature_match=${PNG_SIGNATURE_MATCH}"
            echo "byte_classification=${BYTE_CLASSIFICATION}"
            echo "output_decodable=${DECODABLE}"
            echo "delay_ms=${DELAY_MS}"
            echo "execution_ms=${EXEC_MS}"
            echo "actual_cost_usd=${ACTUAL_COST}"
            echo "output_is_json=${OUTPUT_IS_JSON}"
            echo "error_msg=${ERROR_MSG}"
            echo "error_detail=${ERROR_DETAIL}"
            echo "configured_production_routing_allowed=false"
            echo "warmup_elapsed_seconds=${{ steps.warm-worker.outputs.warmup_elapsed_seconds }}"
            echo "worker_state_transitions=${{ steps.warm-worker.outputs.worker_state_transitions }}"
            echo "cancellation_reason=${{ steps.poll-job.outputs.cancellation_reason }}"
            echo "flashboot_requested=${{ steps.create-endpoint.outputs.flashboot_requested }}"
            echo "flashboot_confirmed=${{ steps.create-endpoint.outputs.flashboot_confirmed }}"
            echo "endpoint_created_epoch=${{ steps.create-endpoint.outputs.endpoint_created_epoch }}"
            echo "first_initializing_timestamp=${{ steps.warm-worker.outputs.first_initializing_timestamp }}"
            echo "first_ready_timestamp=${{ steps.warm-worker.outputs.first_ready_timestamp }}"
            echo "total_warmup_elapsed_seconds=${{ steps.warm-worker.outputs.warmup_elapsed_seconds }}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "sanitized_output<<GATE3_EOF"
            echo "${SANITIZED_OUTPUT}"
            echo "GATE3_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "=== Gate 3 canary evidence (redacted) ==="
          echo "status=${STATUS} ok=${OK} gpu=${GPU} gpu_inference_executed=${GPU_INFERENCE_EXECUTED}"
          echo "providerPostCount=${PROVIDER_POST_COUNT} productionRoutingAllowed=${PRODUCTION_ROUTING}"
          echo "output: ${OUT_W}x${OUT_H} ${OUT_FMT} ${OUT_BYTES} bytes (handler-reported) sha256=${OUT_SHA256} decodable=${DECODABLE}"
          echo "outputDecodedBytes=${DECODED_BYTES} outputBytesMatch=${OUTPUT_BYTES_MATCH} (decoded-file size vs handler-reported outputBytes)"
          echo "producerSha256=${PRODUCER_SHA256} producerHashMatch=${PRODUCER_HASH_MATCH}"
          echo "outputBase64Length=${B64_LENGTH} lengthMod4=${B64_LENGTH_MOD4} (length only; the base64 payload itself is never logged)"
          echo "first8DecodedBytesHex=${FIRST8_HEX} pngSignatureMatch=${PNG_SIGNATURE_MATCH} (expected 89504e470d0a1a0a)"
          echo "byteClassification=${BYTE_CLASSIFICATION}"
          echo "delayMs=${DELAY_MS} executionMs=${EXEC_MS} actualCostUsd=${ACTUAL_COST}"
          echo "outputIsJson=${OUTPUT_IS_JSON} errorMsg=${ERROR_MSG} errorDetail=${ERROR_DETAIL}"
          echo "sanitizedOutput (<=500 chars, outputBase64 stripped): ${SANITIZED_OUTPUT}"
          echo "NOTE: the published handler JSON contract does not expose an explicit"
          echo "detected-face count; faces processed is not fabricated here and is"
          echo "reported as unavailable-from-contract in the evidence PR, not guessed."
          echo "NOTE: RunPod's job status API exposes no stdout/stderr endpoint (confirmed"
          echo "against docs.runpod.io and rest.runpod.io/v1/openapi.json); only the"
          echo "handler's own JSON output/error fields above are obtainable."

      # ---------------------------------------------------------------
      # Retain bounded diagnostic artifacts for postmortem, since RunPod
      # resources (and therefore the original output) are deleted by the
      # mandatory cleanup step below. Uploads only the decoded PNG (if one
      # was produced) and the sanitized metadata JSON built in the evidence
      # step above -- never the base64 payload, the input image, secrets,
      # weights, or a raw authenticated response. if: always() so evidence
      # is retained on both success and failure; short 1-day retention.
      # This upload does not participate in and cannot weaken the Success
      # gate step below, which runs independently on its own criteria.
      # ---------------------------------------------------------------
      - name: "Retain bounded diagnostic artifacts (canary output PNG + sanitized metadata, 1 day)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-canary-output-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/canary_out.png
            ${{ runner.temp }}/canary_output_metadata.json
          if-no-files-found: ignore
          retention-days: 1

      # ---------------------------------------------------------------
      # Diagnostics: worker/queue health snapshot, captured before cleanup
      # begins. Single bounded GET call; if: always() so it still runs when
      # an earlier step failed. This does not delay cleanup beyond the
      # existing bound -- it is one fast read-only call, not a loop or wait.
      # ---------------------------------------------------------------
      - name: "Capture worker/queue health snapshot (before cleanup)"
        if: always()
        id: health-snapshot
        run: |
          ENDPOINT_ID="${{ steps.create-endpoint.outputs.endpoint_id }}"
          if [ -z "$ENDPOINT_ID" ]; then
            echo "No endpoint was created; nothing to snapshot."
            echo "health_snapshot={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEALTH=$(curl -s -X GET "https://api.runpod.ai/v2/${ENDPOINT_ID}/health" -H "Authorization: Bearer $RUNPOD_API_KEY")
          echo "Worker/queue health (redacted, no secrets): ${HEALTH}"
          echo "health_snapshot=$(echo "$HEALTH" | jq -c '.')" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # Success gate: fail closed unless every required condition holds.
      # if: always() so it still reports a clear FAIL reason even when the
      # warm-worker step itself failed (warm-up timeout / insufficient
      # remaining lifecycle) -- steps.evidence always has bounded output by
      # this point, including in the no-job-submitted path.
      # ---------------------------------------------------------------
      - name: Success gate
        if: always()
        run: |
          FAIL=0
          [ "${{ steps.poll-job.outputs.final_status }}" = "COMPLETED" ] || { echo "FAIL: job did not complete"; FAIL=1; }
          [ "${{ steps.evidence.outputs.gpu_inference_executed }}" = "true" ] || { echo "FAIL: gpu_inference_executed is not true"; FAIL=1; }
          [ "${{ steps.evidence.outputs.output_decodable }}" = "true" ] || { echo "FAIL: output is not a valid decodable image"; FAIL=1; }
          [ "${{ steps.evidence.outputs.provider_post_count }}" = "0" ] || { echo "FAIL: providerPostCount is not 0"; FAIL=1; }
          if (( $(echo "${{ steps.evidence.outputs.actual_cost_usd }} > $BUDGET_USD" | bc -l) )); then
            echo "FAIL: actual compute cost exceeds the authorized budget"; FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then
            echo "Gate 3 canary success criteria NOT met; proceeding to mandatory cleanup"
            exit 1
          fi
          echo "PASSED: all Gate 3 canary success criteria met"

      # ---------------------------------------------------------------
      # Mandatory cleanup: always runs, on success, failure, or timeout.
      # Cancels any still-active job, deletes endpoint and template only,
      # verifies no active workers and no matching resources remain, and
      # NEVER touches the Network Volume or its weights.
      # ---------------------------------------------------------------
      - name: "Mandatory cleanup (always) - cancel, delete endpoint/template, verify"
        if: always()
        run: |
          ENDPOINT_ID="${{ steps.create-endpoint.outputs.endpoint_id }}"
          TEMPLATE_ID="${{ steps.create-template.outputs.template_id }}"
          JOB_ID="${{ steps.submit-job.outputs.job_id }}"

          if [ -n "$JOB_ID" ] && [ -n "$ENDPOINT_ID" ]; then
            STATUS=$(curl -s -X GET "https://api.runpod.ai/v2/${ENDPOINT_ID}/status/${JOB_ID}" -H "Authorization: Bearer $RUNPOD_API_KEY" | jq -r '.status // "UNKNOWN"')
            if [ "$STATUS" = "IN_QUEUE" ] || [ "$STATUS" = "IN_PROGRESS" ]; then
              echo "Cancelling still-active job before teardown"
              curl -s -X POST "https://api.runpod.ai/v2/${ENDPOINT_ID}/cancel/${JOB_ID}" -H "Authorization: Bearer $RUNPOD_API_KEY" > /dev/null
            fi
          fi

          WORKERS_ACTIVE="unknown"
          if [ -n "$ENDPOINT_ID" ]; then
            HEALTH=$(curl -s -X GET "https://api.runpod.ai/v2/${ENDPOINT_ID}/health" -H "Authorization: Bearer $RUNPOD_API_KEY")
            echo "Pre-delete health: $HEALTH"
            WORKERS_ACTIVE=$(echo "$HEALTH" | jq -r '((.workers.idle // 0) + (.workers.running // 0))')
          fi

          if [ -n "$ENDPOINT_ID" ]; then
            curl -s -o /dev/null -w "delete endpoint http=%{http_code}\n" -X DELETE "https://rest.runpod.io/v1/endpoints/${ENDPOINT_ID}" -H "Authorization: Bearer $RUNPOD_API_KEY"
          fi
          if [ -n "$TEMPLATE_ID" ]; then
            curl -s -o /dev/null -w "delete template http=%{http_code}\n" -X DELETE "https://rest.runpod.io/v1/templates/${TEMPLATE_ID}" -H "Authorization: Bearer $RUNPOD_API_KEY"
          fi

          CLEANUP_OK=true
          if [ -n "$ENDPOINT_ID" ]; then
            REMAINING=$(curl -s -X GET https://rest.runpod.io/v1/endpoints -H "Authorization: Bearer $RUNPOD_API_KEY" | jq --arg n "$ENDPOINT_NAME" '[.[] | select(.name == $n)] | length')
            [ "$REMAINING" = "0" ] || { echo "CRITICAL: endpoint ${ENDPOINT_NAME} still present after delete"; CLEANUP_OK=false; }
          fi
          if [ -n "$TEMPLATE_ID" ]; then
            REMAINING_T=$(curl -s -X GET https://rest.runpod.io/v1/templates -H "Authorization: Bearer $RUNPOD_API_KEY" | jq --arg n "$TEMPLATE_NAME" '[.[] | select(.name == $n)] | length')
            [ "$REMAINING_T" = "0" ] || { echo "CRITICAL: template ${TEMPLATE_NAME} still present after delete"; CLEANUP_OK=false; }
          fi

          VOLUME_STILL_PRESENT=$(curl -s -X GET https://rest.runpod.io/v1/networkvolumes -H "Authorization: Bearer $RUNPOD_API_KEY" | jq --arg id "$NETWORK_VOLUME_ID" '[.[] | select(.id // "" | startswith($id))] | length')
          [ "$VOLUME_STILL_PRESENT" = "1" ] || { echo "CRITICAL: Network Volume no longer present -- this must never happen"; CLEANUP_OK=false; }

          echo "workers_active_before_delete=${WORKERS_ACTIVE}"
          echo "cleanup_endpoint_deleted=$([ "$REMAINING" = "0" ] && echo true || echo unknown)"
          echo "cleanup_template_deleted=$([ "$REMAINING_T" = "0" ] && echo true || echo unknown)"
          echo "network_volume_preserved=$([ "$VOLUME_STILL_PRESENT" = "1" ] && echo true || echo false)"

          if [ "$CLEANUP_OK" != "true" ]; then
            echo "CRITICAL: cleanup could not be proven; see log above"
            exit 1
          fi
          echo "PASSED: cleanup proven -- no active workers, no matching endpoint/template, volume preserved"

      - name: Summary
        if: always()
        run: |
          echo "### RunPod Gate 3 canary run summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- job status: ${{ steps.evidence.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- job_submitted: ${{ steps.submit-job.outputs.job_submitted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- gpu_inference_executed: ${{ steps.evidence.outputs.gpu_inference_executed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- output: ${{ steps.evidence.outputs.output_width }}x${{ steps.evidence.outputs.output_height }} ${{ steps.evidence.outputs.output_format }}, ${{ steps.evidence.outputs.output_bytes }} bytes, sha256=${{ steps.evidence.outputs.output_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- delayMs=${{ steps.evidence.outputs.delay_ms }} executionMs=${{ steps.evidence.outputs.execution_ms }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- actualCostUsd=${{ steps.evidence.outputs.actual_cost_usd }} (budget=\$${BUDGET_USD})" >> "$GITHUB_STEP_SUMMARY"
          echo "- providerPostCount=${{ steps.evidence.outputs.provider_post_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- productionRoutingAllowed=${{ steps.evidence.outputs.production_routing_allowed }} (configured=${{ steps.evidence.outputs.configured_production_routing_allowed }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- billedDurationSeconds=${{ steps.poll-job.outputs.billed_duration_seconds }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- outputIsJson=${{ steps.evidence.outputs.output_is_json }} errorMsg=${{ steps.evidence.outputs.error_msg }} errorDetail=${{ steps.evidence.outputs.error_detail }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- warmupElapsedSeconds=${{ steps.evidence.outputs.warmup_elapsed_seconds }} cancellationReason=${{ steps.evidence.outputs.cancellation_reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- workerStateTransitions=${{ steps.evidence.outputs.worker_state_transitions }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- flashbootRequested=${{ steps.evidence.outputs.flashboot_requested }} flashbootConfirmed=${{ steps.evidence.outputs.flashboot_confirmed }} (null means the documented response schema omits this optional field)" >> "$GITHUB_STEP_SUMMARY"
          echo "- endpointCreatedEpoch=${{ steps.evidence.outputs.endpoint_created_epoch }} firstInitializingTimestamp=${{ steps.evidence.outputs.first_initializing_timestamp }} firstReadyTimestamp=${{ steps.evidence.outputs.first_ready_timestamp }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- totalWarmupElapsedSeconds=${{ steps.evidence.outputs.total_warmup_elapsed_seconds }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- workerHealthSnapshot=${{ steps.health-snapshot.outputs.health_snapshot }}" >> "$GITHUB_STEP_SUMMARY"
