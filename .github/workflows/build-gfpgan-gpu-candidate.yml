name: Build GFPGAN GPU Worker Candidate

on:
  push:
    branches:
      - runpod-gfpgan-gpu-candidate
      - runpod-gpu-gate2-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-candidate-build
  cancel-in-progress: false

jobs:
  build-test-gpu-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check repository
        uses: actions/checkout@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Build GPU worker candidate image (no push)
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: apps/api/runpod-worker-gpu-dev
          file: apps/api/runpod-worker-gpu-dev/Dockerfile
          push: false
          tags: gfpgan-gpu-candidate:local
          load: true

      - name: Inspect image metadata
        id: image-meta
        run: |
          docker image inspect gfpgan-gpu-candidate:local > "$RUNNER_TEMP/inspect.json"
          image_id=$(jq -r '.[0].Id' "$RUNNER_TEMP/inspect.json")
          size_bytes=$(jq -r '.[0].Size' "$RUNNER_TEMP/inspect.json")
          local_digest=$(jq -r '.[0].RepoDigests[0] // "none"' "$RUNNER_TEMP/inspect.json")
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "local_digest=$local_digest" >> "$GITHUB_OUTPUT"
          echo "image_id: $image_id"
          echo "size_bytes: $size_bytes"
          echo "local_digest: $local_digest"

      - name: Record image metadata artifact (no weights)
        run: |
          mkdir -p "$RUNNER_TEMP/meta"
          {
            echo "image_id=${{ steps.image-meta.outputs.image_id }}"
            echo "size_bytes=${{ steps.image-meta.outputs.size_bytes }}"
            echo "local_digest=${{ steps.image-meta.outputs.local_digest }}"
            echo "gpu_inference_executed=false"
          } > "$RUNNER_TEMP/meta/image-meta.txt"

      - name: Verify non-root runtime user and no bundled weight
        run: |
          runner_user=$(docker run --rm --entrypoint whoami gfpgan-gpu-candidate:local)
          echo "runtime user: $runner_user"
          if [ "$runner_user" = "root" ]; then
            echo "ERROR: container runs as root" >&2
            exit 1
          fi
          # The image itself must not embed a weight at the expected mount path.
          image_has_weight=$(docker run --rm --entrypoint sh gfpgan-gpu-candidate:local -c "test -f /models/GFPGANv1.4.pth && echo present || echo absent")
          echo "weight in image: $image_has_weight"
          if [ "$image_has_weight" != "absent" ]; then
            echo "ERROR: weight must not be bundled in the image" >&2
            exit 1
          fi

      - name: Run health contract test in container (no weight, no GPU)
        run: |
          echo '{"mode":"health"}' | docker run --rm -i --network none gfpgan-gpu-candidate:local --stdin

      - name: Run gpu_probe test in container (no GPU expected)
        run: |
          echo '{"mode":"gpu_probe"}' | docker run --rm -i --network none gfpgan-gpu-candidate:local --stdin

      - name: Run fail-closed restore test in empty-models container (no CUDA)
        env:
          WEIGHT_ABSENT_DIR: ${{ runner.temp }}/empty_models
        run: |
          mkdir -p "$WEIGHT_ABSENT_DIR"
          set +e
          echo '{"mode":"restore","imageBase64":""}' | docker run --rm -i --network none \
            -v "$WEIGHT_ABSENT_DIR:/models" gfpgan-gpu-candidate:local --stdin
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ERROR: restore unexpectedly returned success without weight/CUDA" >&2
            exit 1
          fi
          echo "restore correctly failed closed (exit code $code), expected non-zero"

      - name: Verify no network-download code in worker (read-only scan)
        run: |
          src=$(cat apps/api/runpod-worker-gpu-dev/worker.py)
          low=${src,,}
          for bad in "requests.get" "urllib.request" "urlopen" "wget " "curl " "requests.post" "http.client" "socket.connect" "httpx."; do
            if [[ "$low" == *"$bad"* ]]; then
              echo "ERROR: runtime download code present: $bad" >&2
              exit 1
            fi
          done
          echo "no network-download code detected"

      - name: Generate SBOM (no upload)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-gpu-candidate:local
          format: cyclonedx
          output: sbom.json

      - name: Scan image for vulnerabilities (print findings only)
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: false
        with:
          image-ref: gfpgan-gpu-candidate:local
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Print SBOM and vulnerability summary
        run: |
          echo "SBOM packages:"
          jq -r '.components | length' sbom.json 2>/dev/null || echo "sbom unavailable"
          echo "gpu_inference_executed=false"
