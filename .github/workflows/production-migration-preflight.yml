name: Production Migration Preflight

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply exactly the reviewed pending migrations after preflight"
        required: true
        default: false
        type: boolean
      target_ref:
        description: "Ref to check out for application/migration scripts (workflow definition itself always comes from the dispatch ref)"
        required: true
        default: "release/r9.5-pakistan"
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-preflight
  cancel-in-progress: false

jobs:
  migration:
    name: Read-only production migration preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out the selected release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve and diagnose production database candidates
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
          NORTHFLANK_PROJECT_ID: ai-photo-studio
          NORTHFLANK_SERVICE_ID: ai-photo-studio
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_POOLER_URL: ${{ secrets.NEON_POOLER_URL }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          ALLOW_PRODUCTION_MIGRATIONS: ${{ inputs.apply_migrations == true && 'true' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          status_log="${RUNNER_TEMP}/production-migration-status.log"
          apply_log="${RUNNER_TEMP}/production-migration-apply.log"
          # R9.5-P5R: the two R9.5-P4B/P4B4 migrations this allowlist used to
          # name are already applied to production (confirmed by the P5J
          # packet's clean status run) and are no longer pending anywhere.
          # The sole currently-pending migration for this release is P5P's
          # item-level restoration entitlement migration.
          expected_one='20260810000000_r95_p5p_item_level_restoration_entitlement'

          diagnose_url() {
            CHECK_URL="$1" node -e 'const dns=require("node:dns"); const net=require("node:net"); const value=process.env.CHECK_URL||""; let parsed; try { parsed=new URL(value) } catch { parsed=null } const valid=!!parsed; console.log(`schemeValid=${valid&&(parsed.protocol==="postgres:"||parsed.protocol==="postgresql:")}`); console.log(`hostnamePresent=${!!(parsed&&parsed.hostname)}`); console.log(`databaseNamePresent=${!!(parsed&&parsed.pathname&&parsed.pathname.length>1)}`); console.log(`passwordPresent=${!!(parsed&&parsed.password)}`); console.log(`sslConfigured=${!!(parsed&&((parsed.searchParams.get("sslmode")||"")!=="disable"||parsed.searchParams.has("ssl")))}`); console.log(`urlParseValid=${valid}`); if(!valid||!parsed.hostname){console.log("dnsResolvable=NO"); console.log("tcpReachable=NO"); process.exit(0)} dns.lookup(parsed.hostname,{all:false},(dnsError)=>{ console.log(`dnsResolvable=${dnsError?"NO":"YES"}`); if(dnsError){console.log("tcpReachable=NO"); return} const socket=net.createConnection({host:parsed.hostname,port:Number(parsed.port||5432)}); let done=false; const finish=(ok)=>{if(done)return;done=true;socket.destroy();console.log(`tcpReachable=${ok?"YES":"NO"}`)}; socket.setTimeout(5000); socket.once("connect",()=>finish(true)); socket.once("timeout",()=>finish(false)); socket.once("error",()=>finish(false)); });' 2>/dev/null
          }

          classify_failure() {
            if grep -qiE 'P1001|ECONNREFUSED|ETIMEDOUT' "$1"; then echo 'failure_class=DATABASE_HOST_UNREACHABLE';
            elif grep -qiE 'ENOTFOUND|EAI_AGAIN|could not translate host' "$1"; then echo 'failure_class=DNS_FAILURE';
            elif grep -qiE 'P1000|authentication failed|password authentication' "$1"; then echo 'failure_class=AUTH_FAILURE';
            elif grep -qiE 'P1003|database .* does not exist' "$1"; then echo 'failure_class=DATABASE_NOT_FOUND';
            elif grep -qiE 'P1013|invalid.*connection|malformed' "$1"; then echo 'failure_class=DATABASE_URL_MALFORMED';
            elif grep -qiE 'SSL|TLS|certificate' "$1"; then echo 'failure_class=TLS_SSL_FAILURE';
            else echo 'failure_class=PRISMA_COMMAND_FAILURE'; fi
          }

          try_candidate() {
            local source="$1" candidate="$2" status_exit pending_count
            [[ -n "$candidate" ]] || return 1
            echo "candidate_source=${source}"
            echo 'url_diagnostics_start'
            diagnose_url "$candidate"
            echo 'url_diagnostics_end'
            echo "::add-mask::${candidate}"
            set +e
            DATABASE_URL="$candidate" npm run db:migrate:status:production >"${status_log}" 2>&1
            status_exit=$?
            set -e
            # R9.5-P5R3: Prisma's migration-folder timestamp prefix is 14
            # digits total (YYYYMMDDHHMMSS, e.g. 20260810000000) -- the
            # previous pattern required 17 (literal "202" + {14} more) and
            # never matched a real migration name, so a genuinely pending
            # migration was always misclassified as a command failure.
            mapfile -t pending < <(grep -oE '20[0-9]{12}_[A-Za-z0-9_-]+' "${status_log}" | sort -u || true)
            pending_count=${#pending[@]}
            if (( status_exit == 0 )) && (( pending_count == 0 )); then
              echo 'migration_status=clean'
              echo 'sanitized_command_output_start'
              cat "${status_log}"
              echo 'sanitized_command_output_end'
              SELECTED_URL="$candidate"; SELECTED_SOURCE="$source"; PENDING_COUNT=0
              rm -f "${status_log}"; return 0
            fi
            if (( pending_count == 1 )) && [[ "${pending[0]}" == "${expected_one}" ]]; then
              echo "pending_migration=${pending[0]}"
              echo 'migration_status=expected_pending'
              echo 'sanitized_command_output_start'
              cat "${status_log}"
              echo 'sanitized_command_output_end'
              SELECTED_URL="$candidate"; SELECTED_SOURCE="$source"; PENDING_COUNT=1
              rm -f "${status_log}"; return 0
            fi
            classify_failure "${status_log}"
            for migration in "${pending[@]}"; do echo "pending_migration=${migration}"; done
            echo "status_exit_code=${status_exit}"
            echo "status_log_bytes=$(wc -c < "${status_log}" 2>/dev/null || echo 0)"
            echo 'sanitized_command_output_start'
            cat "${status_log}"
            echo 'sanitized_command_output_end'
            rm -f "${status_log}"
            return 1
          }

          SELECTED_URL=''; SELECTED_SOURCE=''; PENDING_COUNT=0
          candidates=(
            "NEON_DIRECT_URL|${NEON_DIRECT_URL:-}"
            "DATABASE_URL|${DATABASE_URL_SECRET:-}"
            "NEON_DATABASE_URL|${NEON_DATABASE_URL:-}"
            "NEON_POOLER_URL|${NEON_POOLER_URL:-}"
          )
          for item in "${candidates[@]}"; do
            source="${item%%|*}"; candidate="${item#*|}"
            if try_candidate "$source" "$candidate"; then break; fi
          done

          if [[ -z "${SELECTED_URL}" && -n "${NORTHFLANK_API_KEY:-}" ]]; then
            response="$(curl --fail --silent --max-time 30 \
              -H "Authorization: Bearer ${NORTHFLANK_API_KEY}" \
              "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/${NORTHFLANK_SERVICE_ID}/runtime-environment" 2>/dev/null || true)"
            runtime_url="$(jq -r '.runtimeEnvironment.DATABASE_URL // .data.runtimeEnvironment.DATABASE_URL // .DATABASE_URL // .data.DATABASE_URL // empty' <<<"${response}")"
            unset response
            if [[ -n "${runtime_url}" && "${runtime_url}" != "null" ]]; then
              try_candidate 'northflank_runtime_environment' "$runtime_url" || true
              unset runtime_url
            else
              echo 'northflank_resolution=unavailable'
            fi
          fi

          if [[ -z "${SELECTED_URL}" ]]; then
            echo 'migration_status=DATABASE_CONNECTIVITY_OR_CONFIGURATION_BLOCKED'
            exit 1
          fi

          echo "selected_database_source=${SELECTED_SOURCE}"
          if [[ "${APPLY_MIGRATIONS}" != "true" ]]; then
            echo 'apply_migrations=false'
            unset SELECTED_URL
            exit 0
          fi

          if (( PENDING_COUNT != 1 )); then
            echo "apply_migrations=not_needed"
            unset SELECTED_URL
            exit 0
          fi

          DATABASE_URL="${SELECTED_URL}" npm run db:migrate:production >"${apply_log}" 2>&1
          mapfile -t applied < <(grep -oE '20[0-9]{12}_[A-Za-z0-9_-]+' "${apply_log}" | sort -u || true)
          rm -f "${apply_log}"
          for migration in "${applied[@]}"; do echo "applied_migration=${migration}"; done
          echo "apply_migrations=true"
          unset SELECTED_URL
