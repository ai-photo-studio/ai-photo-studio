name: Production Migration Preflight

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply exactly the reviewed pending migrations after preflight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-migration-preflight
  cancel-in-progress: false

jobs:
  migration:
    name: Read-only production migration preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out the selected release ref
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve production database through Northflank
        id: resolve
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
          NORTHFLANK_PROJECT_ID: ai-photo-studio
          NORTHFLANK_SERVICE_ID: ai-photo-studio
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NORTHFLANK_API_KEY:-}" ]]; then
            echo "NORTHFLANK_API_KEY is unavailable"
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${NORTHFLANK_API_KEY}" \
            "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/${NORTHFLANK_SERVICE_ID}/runtime-environment")"
          database_url="$(jq -r '.runtimeEnvironment.DATABASE_URL // .data.runtimeEnvironment.DATABASE_URL // .DATABASE_URL // .data.DATABASE_URL // empty' <<<"${response}")"
          unset response
          if [[ -z "${database_url}" || "${database_url}" == "null" ]]; then
            echo "Northflank runtime DATABASE_URL is unavailable or unreadable"
            exit 1
          fi
          echo "::add-mask::${database_url}"
          {
            printf 'DATABASE_URL<<EOF\n%s\nEOF\n' "${database_url}"
          } >> "${GITHUB_ENV}"
          unset database_url
          echo "database_source=northflank_runtime_environment" >> "${GITHUB_OUTPUT}"

      - name: Run guarded migration status and optional apply
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          ALLOW_PRODUCTION_MIGRATIONS: ${{ inputs.apply_migrations == true && 'true' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          status_log="${RUNNER_TEMP}/production-migration-status.log"
          apply_log="${RUNNER_TEMP}/production-migration-apply.log"
          expected_one='20260808000000_r95_p4b_pricebook_v2_tiers'
          expected_two='20260809000000_r95_p4b4_print_delivery_address'

          set +e
          npm run db:migrate:status:production >"${status_log}" 2>&1
          status_exit=$?
          set -e
          mapfile -t pending < <(grep -oE '202[0-9]{14}_[A-Za-z0-9_-]+' "${status_log}" | sort -u || true)
          rm -f "${status_log}"

          if (( status_exit == 0 )) && (( ${#pending[@]} == 0 )); then
            echo "migration_status=clean"
          elif (( ${#pending[@]} == 2 )) && [[ "${pending[0]}" == "${expected_one}" && "${pending[1]}" == "${expected_two}" ]]; then
            echo "pending_migration=${pending[0]}"
            echo "pending_migration=${pending[1]}"
            echo "migration_status=expected_pending"
          else
            echo "migration_status=drift_or_unexpected_failure"
            for migration in "${pending[@]}"; do echo "pending_migration=${migration}"; done
            exit 1
          fi

          if [[ "${APPLY_MIGRATIONS}" != "true" ]]; then
            echo "apply_migrations=false"
            exit 0
          fi

          if (( ${#pending[@]} != 2 )); then
            echo "apply_migrations=not_needed"
            exit 0
          fi

          npm run db:migrate:production >"${apply_log}" 2>&1
          mapfile -t applied < <(grep -oE '202[0-9]{14}_[A-Za-z0-9_-]+' "${apply_log}" | sort -u || true)
          rm -f "${apply_log}"
          for migration in "${applied[@]}"; do echo "applied_migration=${migration}"; done
          echo "apply_migrations=true"
