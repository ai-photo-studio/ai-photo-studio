name: Build RunPod Serverless Handler Wrapper

on:
  push:
    branches:
      - runpod-serverless-handler-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handler-wrapper-build
  cancel-in-progress: false

jobs:
  build-test-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Build handler wrapper image (no push)
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: apps/api/runpod-worker-gpu-serverless-dev
          file: apps/api/runpod-worker-gpu-serverless-dev/Dockerfile
          push: false
          tags: gfpgan-serverless-handler:local
          load: true

      - name: Inspect image metadata
        id: image-meta
        run: |
          docker image inspect gfpgan-serverless-handler:local > "$RUNNER_TEMP/inspect.json"
          image_id=$(jq -r '.[0].Id' "$RUNNER_TEMP/inspect.json")
          size_bytes=$(jq -r '.[0].Size' "$RUNNER_TEMP/inspect.json")
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "image_id: $image_id"
          echo "size_bytes: $size_bytes"

      - name: Verify base digest, OCI revision, non-root, entrypoint, no weights
        run: |
          docker image inspect gfpgan-serverless-handler:local > "$RUNNER_TEMP/in.json"
          # base image should include the immutable CLI image as a layer (rootfs ancestry)
          rootfs=$(jq -r '.[0].RootFS.Layers | length' "$RUNNER_TEMP/in.json")
          entry=$(jq -r '.[0].Config.Entrypoint | tojson' "$RUNNER_TEMP/in.json")
          cmd=$(jq -r '.[0].Config.Cmd | tojson' "$RUNNER_TEMP/in.json")
          user=$(jq -r '.[0].Config.User' "$RUNNER_TEMP/in.json")
          echo "rootfs layers: $rootfs"
          echo "entrypoint: $entry"
          echo "cmd: $cmd"
          echo "user: $user"
          # non-root runtime
          if [ "$user" = "root" ] || [ "$user" = "" ]; then echo "NOT NON-ROOT" >&2; exit 1; fi
          # entrypoint must be empty (base cleared) so CMD runs the handler
          if [ "$entry" != "[]" ]; then echo "ENTRYPOINT NOT CLEARED" >&2; exit 1; fi
          echo "cmd includes handler: $cmd" | grep -q "handler.py" || { echo "handler cmd missing" >&2; exit 1; }

      - name: Verify no weights bundled and immutable base layer
        run: |
          set +e
          docker run --rm --entrypoint ls gfpgan-serverless-handler:local -la /models 2>/dev/null
          set -e
          has=$(docker run --rm --entrypoint sh gfpgan-serverless-handler:local -c "test -f /models/GFPGANv1.4.pth && echo present || echo absent")
          echo "weights in image: $has"
          [ "$has" = "absent" ] || { echo "WEIGHTS PRESENT" >&2; exit 1; }

      - name: Run handler unit tests in container (network none, mocks only)
        run: |
          docker run --rm -i --network none \
            -v "$PWD/apps/api/runpod-worker-gpu-serverless-dev/test_handler.py":/srv/handler/test_handler.py:ro \
            -w /srv/handler \
            gfpgan-serverless-handler:local \
            python3.10 -m unittest test_handler -v 2>&1 | tail -5

      - name: Run handler entrypoint smoke (health mode, no real GPU) under network none
        run: |
          # Do NOT start the runpod serverless loop (it requires a RunPod connection).
          # Instead verify the module imports and the handler function is defined.
          docker run --rm -i --network none -w /srv/handler gfpgan-serverless-handler:local \
            sh -c 'python3.10 -c "import handler as h; assert callable(h.handler); print(\"handler callable\")"'

      - name: Scan handler image for CRITICAL (zero required)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-serverless-handler:local
          format: json
          output: trivy.json
          exit-code: 0
          severity: CRITICAL
          ignore-unfixed: true

      - name: Assert zero CRITICAL and CVE-2025-32434 absent
        run: |
          jq -e '(.Results | to_entries | map(.value.Vulnerabilities // []) | add | length) == 0' trivy.json >/dev/null 2>&1 \
            || { echo "CRITICAL PRESENT" >&2; exit 1; }
          if grep -q "CVE-2025-32434" trivy.json; then echo "CVE-2025-32434 PRESENT" >&2; exit 1; fi
          echo "zero CRITICAL, no CVE-2025-32434; gpu_inference_executed=false"

      - name: Generate SBOM (no upload)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-serverless-handler:local
          format: cyclonedx
          output: sbom.json

      - name: Print SBOM summary
        run: |
          echo "SBOM packages:"; jq -r '.components | length' sbom.json 2>/dev/null || echo "n/a"
          echo "gpu_inference_executed=false"
