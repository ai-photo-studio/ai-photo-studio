name: Validate End-to-End Restoration
on:
  workflow_run:
    workflows: ["Deploy to Northflank"]
    types: [completed]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E protected mock commerce
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Configure PostgreSQL tool path
        run: echo "PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Run protected local commerce E2E
        run: npm run test:e2e:commerce-local
