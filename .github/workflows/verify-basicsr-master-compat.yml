name: BasicSR Master Compat Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: "1"
      TEMP_WEIGHT_DIR: ${{ runner.temp }}/weight
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download official BasicSR fix-commit source archive and hash it
        run: |
          COMMIT=8d56e3a045f9fb3e1d8872f92ee4a4f07f886b0a
          TARBALL="$RUNNER_TEMP/basicsr-$COMMIT.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$TARBALL" \
            "https://github.com/XPixelGroup/BasicSR/archive/$COMMIT.tar.gz"
          sha256sum "$TARBALL" | tee "$RUNNER_TEMP/source_sha256.txt"
          cat "$RUNNER_TEMP/source_sha256.txt"

      - name: Install torch 2.6.0 + torchvision 0.21.0 (cu126), then BasicSR fix commit + gfpgan + facexlib
        run: |
          COMMIT=8d56e3a045f9fb3e1d8872f92ee4a4f07f886b0a
          python -m pip install --no-cache-dir numpy==1.26.4 opencv-python-headless==4.9.0.80 Pillow==10.2.0 PyYAML==6.0.1 tqdm==4.66.2
          python -m pip install --no-cache-dir \
            torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cu126
          python -m pip install --no-cache-dir "https://github.com/XPixelGroup/BasicSR/archive/$COMMIT.tar.gz"
          python -m pip install --no-cache-dir gfpgan==1.3.8 facexlib==0.3.0

      - name: Assert no undocumented functional_tensor import is required
        run: |
          python - <<'PY'
          import torch, torchvision
          print("torch", torch.__version__, "cuda_available", torch.cuda.is_available())
          print("torchvision", torchvision.__version__)
          # functional_tensor is removed in 0.21; import must not be required.
          import importlib.util
          print("has_functional_tensor", importlib.util.find_spec("torchvision.transforms.functional_tensor") is not None)
          import basicsr
          print("basicsr", basicsr.__version__ if hasattr(basicsr,'__version__') else 'imported')
          import gfpgan
          print("gfpgan imported")
          import facexlib
          print("facexlib imported")
          PY

      - name: Construct GFPGANer (arch construction) with safe-load env
        continue-on-error: false
        run: |
          TORCH_FORCE_WEIGHTS_ONLY_LOAD=1 python - <<'PY'
          import torch
          from gfpgan.utils import GFPGANer
          # Construct with a dummy path to prove the arch/build path does NOT
          # hit the removed functional_tensor import. Model load is not executed.
          try:
              m = GFPGANer(model_path="/nonexistent/GFPGANv1.4.pth", upscale=1, arch="clean",
                           channel_multiplier=2, bg_upsampler=None)
              print("GFPGANer constructed (arch path OK)")
          except FileNotFoundError:
              print("GFPGANer arch construction succeeded; model file absent (expected; no load executed)")
          except Exception as e:
              print(type(e).__name__, str(e))
              raise
          PY

      - name: Record safe-load environment contract
        run: |
          echo "TORCH_FORCE_WEIGHTS_ONLY_LOAD=${TORCH_FORCE_WEIGHTS_ONLY_LOAD}"
          # Reject the opt-out env var if set.
          if [ -n "${TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD:-}" ]; then
            echo "ERROR: TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD must not be set" >&2
            exit 1
          fi
          echo "no weights_only=false fallback enforced"
          echo "gpu_inference_executed=false"

      - name: Cleanup temporary files (always)
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/weight" "$RUNNER_TEMP"/basicsr-*.tar.gz
