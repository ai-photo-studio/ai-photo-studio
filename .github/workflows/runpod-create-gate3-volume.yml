name: runpod-create-gate3-volume

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CREATE_ONE_GATE3_VOLUME to proceed"
        required: true
        type: string

permissions:
  contents: read

env:
  RUNPODCTL_VERSION: "v2.8.0"
  # Fixed, console-proven configuration (RunPod Create Network Volume UI, manual evidence
  # supplied 2026-08-01): GPU filter "NVIDIA RTX 4000 Ada Generation" showed EU-RO-1 as
  # selectable with Low availability, Global Networking, S3. Volume size and rate are the
  # UI-displayed values for this datacenter. This is a fixed, non-discovered value -- the
  # preflight step below re-verifies it against live runpodctl GPU/datacenter evidence and
  # stops before any mutation if the live data contradicts it.
  TARGET_DATACENTER_ID: "EU-RO-1"
  TARGET_GPU_DISPLAY_NAME: "RTX 4000 Ada"
  VOLUME_SIZE_GB: "10"
  MAX_MONTHLY_STORAGE_COST_USD: "0.70"

jobs:
  create-volume:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "CREATE_ONE_GATE3_VOLUME" ]; then
            echo "ERROR: Confirmation input must be exactly CREATE_ONE_GATE3_VOLUME"
            exit 1
          fi
          echo "Confirmation verified: ${{ github.event.inputs.confirmation }}"

      - name: Install runpodctl (pinned release binary)
        run: |
          echo "=== Installing runpodctl ${RUNPODCTL_VERSION} from a pinned GitHub release binary ==="
          curl -fsSL -o /usr/local/bin/runpodctl \
            "https://github.com/runpod/runpodctl/releases/download/${RUNPODCTL_VERSION}/runpodctl-linux-amd64"
          chmod +x /usr/local/bin/runpodctl
          runpodctl version

      - name: Preflight - Verify fixed datacenter against live GPU evidence (runpodctl, read-only)
        id: preflight
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "=== Preflight: verifying the fixed, console-proven datacenter against live runpodctl evidence ==="
          # The API key is read directly from the environment (viper.AutomaticEnv());
          # the deprecated 'runpodctl config' subcommand is not used.
          echo "Fixed target: datacenter=${TARGET_DATACENTER_ID} gpu=${TARGET_GPU_DISPLAY_NAME} size=${VOLUME_SIZE_GB}GB cap=\$${MAX_MONTHLY_STORAGE_COST_USD}/mo"

          runpodctl gpu list --include-unavailable -o json > gputypes.json 2>gputypes.err || true

          echo "GPU query exit evidence (stderr, key redacted):"
          sed 's/[A-Za-z0-9_-]\{20,\}/***REDACTED***/g' gputypes.err || true

          if [ ! -s gputypes.json ] || ! jq -e . gputypes.json >/dev/null 2>&1; then
            echo "ERROR: gpu list did not return valid JSON"
            exit 1
          fi

          echo ""
          echo "NOTE: 'runpodctl gpu list' returns gpuId/displayName/memoryInGb/secureCloud/"
          echo "communityCloud/securePricePerHr/communityPricePerHr/stockStatus/available/"
          echo "dataCenterAvailability[dataCenterId,stockStatus] (confirmed via runpodctl v2.8.0"
          echo "source inspection). This is the only documented field usable to prove GPU/"
          echo "datacenter co-location; no storage-capability field exists in any runpodctl or"
          echo "REST output, so this step does not claim to verify storage support -- it relies"
          echo "on the manually supplied RunPod console evidence for that, and only verifies the"
          echo "GPU side against live data before allowing any mutation."

          # Does the fixed target GPU (by display name) actually list the fixed target
          # datacenter in its documented dataCenterAvailability? This directly re-verifies the
          # manually supplied console evidence (EU-RO-1 / RTX 4000 Ada) against live data.
          MATCH_COUNT=$(jq -r --arg dc "$TARGET_DATACENTER_ID" --arg gpu "$TARGET_GPU_DISPLAY_NAME" '
            [.[] | select((.displayName // "") | test($gpu; "i"))
             | (.dataCenterAvailability // [])[] | select(.dataCenterId == $dc)] | length' gputypes.json 2>/dev/null || echo 0)

          echo ""
          echo "Live dataCenterAvailability entries matching fixed target: ${MATCH_COUNT}"

          if [ "$MATCH_COUNT" = "0" ]; then
            echo "FAILED: live runpodctl evidence does not confirm ${TARGET_GPU_DISPLAY_NAME} is"
            echo "available in ${TARGET_DATACENTER_ID}. This contradicts the manually supplied"
            echo "console evidence. Stopping before any mutation; do not proceed on stale or"
            echo "mismatched evidence."
            exit 1
          fi

          echo "PASSED: live evidence confirms ${TARGET_GPU_DISPLAY_NAME} availability in ${TARGET_DATACENTER_ID}"
          echo "datacenter_id=${TARGET_DATACENTER_ID}" >> "$GITHUB_OUTPUT"

      - name: Preflight - Verify existing volumes
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "=== Checking existing Network Volumes ==="
          EXISTING=$(curl -s -X GET https://rest.runpod.io/v1/networkvolumes \
            -H "Authorization: Bearer $RUNPOD_API_KEY" 2>&1)

          echo "Existing volumes (name/size/datacenter only):"
          echo "$EXISTING" | jq '[.[] | {name, size, dataCenterId}]' 2>/dev/null || echo "(unparseable response)"

          if echo "$EXISTING" | jq -e '[.[] | select(.name == "photo-restoration-gate3-models")] | length > 0' >/dev/null 2>&1; then
            echo "ERROR: Volume photo-restoration-gate3-models already exists"
            exit 1
          fi
          echo "No existing volume with name photo-restoration-gate3-models"

      - name: Cost guard
        run: |
          echo "=== Cost Guard: Verifying fixed size and console-displayed storage rate ==="
          STANDARD_RATE_PER_GB_MONTH=0.07
          COMPUTED_COST=$(echo "$VOLUME_SIZE_GB * $STANDARD_RATE_PER_GB_MONTH" | bc)

          echo "Volume configuration (fixed, console-proven):"
          echo "  Size: ${VOLUME_SIZE_GB} GB"
          echo "  Storage rate: $STANDARD_RATE_PER_GB_MONTH /GB/month (console-displayed rate, EU-RO-1)"
          echo "  Computed monthly cost: $COMPUTED_COST"
          echo "  Authorized monthly cap: \$${MAX_MONTHLY_STORAGE_COST_USD}"
          echo ""

          if (( $(echo "$COMPUTED_COST > $MAX_MONTHLY_STORAGE_COST_USD" | bc -l) )); then
            echo "ERROR: Computed monthly storage cost $COMPUTED_COST exceeds authorized cap of \$${MAX_MONTHLY_STORAGE_COST_USD}"
            exit 1
          fi

          if [ "$VOLUME_SIZE_GB" != "10" ]; then
            echo "ERROR: Volume size must be exactly 10 GB (fixed, console-proven)"
            exit 1
          fi

          echo "Cost guard verification PASSED"
          echo "Authorized spending: exactly $COMPUTED_COST for storage only"

      - name: Create Network Volume (POST exactly once)
        id: create-volume
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          TARGET_DC: ${{ steps.preflight.outputs.datacenter_id }}
        run: |
          echo "=== Creating Network Volume (single POST, no retry) ==="

          if [ -z "$TARGET_DC" ] || [ "$TARGET_DC" != "$TARGET_DATACENTER_ID" ]; then
            echo "ERROR: no target datacenter resolved from preflight, or it does not match the fixed authorized datacenter"
            exit 1
          fi

          PAYLOAD=$(jq -n --arg dc "$TARGET_DC" --argjson size "$VOLUME_SIZE_GB" '{
            "name": "photo-restoration-gate3-models",
            "size": $size,
            "dataCenterId": $dc
          }')

          echo "POST payload:"
          echo "$PAYLOAD" | jq 'del(.dataCenterId) + {dataCenterId: "***REDACTED***"}'
          echo ""

          RESPONSE=$(curl -s -X POST https://rest.runpod.io/v1/networkvolumes \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -d "$PAYLOAD" 2>&1)

          VOLUME_ID=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null)
          if [ -z "$VOLUME_ID" ]; then
            echo "ERROR: Failed to create volume or extract ID from response"
            echo "$RESPONSE" | jq 'del(.id)' 2>/dev/null || echo "(unparseable response)"
            exit 1
          fi

          echo ""
          echo "Volume created with ID: ${VOLUME_ID:0:8}..." # Redacted in logs
          echo "volume_id=${VOLUME_ID}" >> "$GITHUB_OUTPUT"
          echo "volume_id_redacted=${VOLUME_ID:0:8}..." >> "$GITHUB_OUTPUT"

      - name: Post-creation verification (GET volumes)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "=== Post-creation verification: Listing all volumes ==="

          VOLUMES=$(curl -s -X GET https://rest.runpod.io/v1/networkvolumes \
            -H "Authorization: Bearer $RUNPOD_API_KEY" 2>&1)

          echo "Volumes list (name/size/datacenter only):"
          echo "$VOLUMES" | jq '[.[] | {name, size, dataCenterId}]' 2>/dev/null || echo "(unparseable response)"

          COUNT=$(echo "$VOLUMES" | jq '[.[] | select(.name == "photo-restoration-gate3-models")] | length' 2>/dev/null)

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected 1 volume named photo-restoration-gate3-models, found $COUNT"
            exit 1
          fi

          SIZE=$(echo "$VOLUMES" | jq '.[] | select(.name == "photo-restoration-gate3-models") | .size' 2>/dev/null)
          DATACENTER=$(echo "$VOLUMES" | jq -r '.[] | select(.name == "photo-restoration-gate3-models") | .dataCenterId // .datacenter' 2>/dev/null)

          echo ""
          echo "Verification passed:"
          echo "  - Volume count: 1 (photo-restoration-gate3-models)"
          echo "  - Size: $SIZE GB (expected: ${VOLUME_SIZE_GB} GB)"
          echo "  - Datacenter (redacted): ${DATACENTER:0:4}*** (expected prefix matches ${TARGET_DATACENTER_ID:0:4})"

          if [ "$SIZE" != "$VOLUME_SIZE_GB" ]; then
            echo "ERROR: Size mismatch: expected ${VOLUME_SIZE_GB} GB, got $SIZE GB"
            exit 1
          fi

          if [ "$DATACENTER" != "$TARGET_DATACENTER_ID" ]; then
            echo "ERROR: Datacenter mismatch: expected ${TARGET_DATACENTER_ID}, got a different value"
            exit 1
          fi

      - name: Publication verification summary
        run: |
          echo "==============================================="
          echo "Network Volume Creation Summary"
          echo "==============================================="
          echo ""
          echo "Preflight verification PASSED (runpodctl datacenter/gpu discovery)"
          echo "Cost guard verification PASSED"
          echo "Volume creation: single POST to /v1/networkvolumes (no retry)"
          echo "No endpoint/template/worker/job operations"
          echo "No raw authenticated response persisted"
          echo "Post-creation verification PASSED"
          echo ""
          echo "Next: Verify region compatibility and run Gate 3 validators"
