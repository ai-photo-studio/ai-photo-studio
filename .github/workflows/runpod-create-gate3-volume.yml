name: runpod-create-gate3-volume

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CREATE_ONE_GATE3_VOLUME to proceed"
        required: true
        type: string

permissions:
  contents: read

env:
  RUNPODCTL_VERSION: "v2.8.0"

jobs:
  create-volume:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "CREATE_ONE_GATE3_VOLUME" ]; then
            echo "ERROR: Confirmation input must be exactly CREATE_ONE_GATE3_VOLUME"
            exit 1
          fi
          echo "Confirmation verified: ${{ github.event.inputs.confirmation }}"

      - name: Install runpodctl (pinned release binary)
        run: |
          echo "=== Installing runpodctl ${RUNPODCTL_VERSION} from a pinned GitHub release binary ==="
          curl -fsSL -o /usr/local/bin/runpodctl \
            "https://github.com/runpod/runpodctl/releases/download/${RUNPODCTL_VERSION}/runpodctl-linux-amd64"
          chmod +x /usr/local/bin/runpodctl
          runpodctl version

      - name: Preflight - Query datacenters and GPU types (runpodctl, read-only)
        id: preflight
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "=== Preflight: querying datacenter and GPU availability via runpodctl ==="
          # The API key is read directly from the environment (viper.AutomaticEnv());
          # the deprecated 'runpodctl config' subcommand is not used.

          runpodctl datacenter list -o json > datacenters.json 2>datacenters.err || true
          runpodctl gpu list --include-unavailable -o json > gputypes.json 2>gputypes.err || true

          echo "Datacenter query exit evidence (stderr, key redacted):"
          sed 's/[A-Za-z0-9_-]\{20,\}/***REDACTED***/g' datacenters.err || true
          echo "GPU query exit evidence (stderr, key redacted):"
          sed 's/[A-Za-z0-9_-]\{20,\}/***REDACTED***/g' gputypes.err || true

          if [ ! -s datacenters.json ] || ! jq -e . datacenters.json >/dev/null 2>&1; then
            echo "ERROR: datacenter list did not return valid JSON"
            exit 1
          fi
          if [ ! -s gputypes.json ] || ! jq -e . gputypes.json >/dev/null 2>&1; then
            echo "ERROR: gpu list did not return valid JSON"
            exit 1
          fi

          echo ""
          echo "Preflight checklist:"
          echo "  - Datacenters with storage/network-volume support"
          echo "  - 16GB-class GPU availability"
          echo "  - Serverless Flex rate <= \$0.58/hr (official documented rate, not queried here)"
          echo "  - Storage rate <= \$0.07/GB/month (5GB volume cost <= \$0.35/mo)"

          # Datacenters that advertise storage support (field name may vary by runpodctl version).
          STORAGE_DCS=$(jq -r '
            [.[] | select((.storageSupport == true) or (.storage_support == true) or (.supportNetworkVolume == true))
             | .id // .Id // .ID] | unique | .[]' datacenters.json 2>/dev/null || true)

          # 16GB-class GPU candidates, available (or include-unavailable listed) with a recognizable name.
          COMPATIBLE_GPUS=$(jq -r '
            [.[] | select((.displayName // .DisplayName // "") | test("A4000|A4500|RTX 4000 Ada|RTX 2000 Ada"; "i"))
             | .gpuId // .id // .Id] | unique | .[]' gputypes.json 2>/dev/null || true)

          echo ""
          echo "Storage-capable datacenters found: $(echo "$STORAGE_DCS" | grep -c . || true)"
          echo "Compatible 16GB-class GPU types found: $(echo "$COMPATIBLE_GPUS" | grep -c . || true)"

          if [ -z "$STORAGE_DCS" ] || [ -z "$COMPATIBLE_GPUS" ]; then
            echo "FAILED: No storage-capable datacenter and/or no compatible 16GB-class GPU found"
            exit 1
          fi

          # Pick the first storage-capable datacenter as the target. Co-location with the
          # compatible GPU pool is confirmed only informationally here; authoritative
          # co-location proof happens in post-creation verification against the account.
          TARGET_DC=$(echo "$STORAGE_DCS" | head -n1)
          if [ -z "$TARGET_DC" ]; then
            echo "FAILED: Could not select a target datacenter"
            exit 1
          fi

          echo "PASSED: selected target datacenter (id redacted in summary): ${TARGET_DC:0:4}***"
          echo "datacenter_id=${TARGET_DC}" >> "$GITHUB_OUTPUT"

      - name: Preflight - Verify existing volumes
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "=== Checking existing Network Volumes ==="
          EXISTING=$(curl -s -X GET https://rest.runpod.io/v1/networkvolumes \
            -H "Authorization: Bearer $RUNPOD_API_KEY" 2>&1)

          echo "Existing volumes (name/size/datacenter only):"
          echo "$EXISTING" | jq '[.[] | {name, size, dataCenterId}]' 2>/dev/null || echo "(unparseable response)"

          if echo "$EXISTING" | jq -e '[.[] | select(.name == "photo-restoration-gate3-models")] | length > 0' >/dev/null 2>&1; then
            echo "ERROR: Volume photo-restoration-gate3-models already exists"
            exit 1
          fi
          echo "No existing volume with name photo-restoration-gate3-models"

      - name: Cost guard
        run: |
          echo "=== Cost Guard: Verifying size and storage rate ==="
          VOLUME_SIZE_GB=5
          STANDARD_RATE_PER_GB_MONTH=0.07
          MAX_STORAGE_COST=$(echo "$VOLUME_SIZE_GB * $STANDARD_RATE_PER_GB_MONTH" | bc)

          echo "Volume configuration:"
          echo "  Size: $VOLUME_SIZE_GB GB"
          echo "  Storage rate: $STANDARD_RATE_PER_GB_MONTH /GB/month (Standard tier)"
          echo "  Maximum monthly cost: $MAX_STORAGE_COST"
          echo ""

          if (( $(echo "$MAX_STORAGE_COST > 0.35" | bc -l) )); then
            echo "ERROR: Monthly storage cost $MAX_STORAGE_COST exceeds limit of 0.35"
            exit 1
          fi

          if (( $(echo "$STANDARD_RATE_PER_GB_MONTH > 0.07" | bc -l) )); then
            echo "ERROR: Storage rate per GB/month exceeds limit of 0.07"
            exit 1
          fi

          echo "Cost guard verification PASSED"
          echo "Authorized spending: exactly $MAX_STORAGE_COST for storage only"

      - name: Create Network Volume (POST exactly once)
        id: create-volume
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          TARGET_DC: ${{ steps.preflight.outputs.datacenter_id }}
        run: |
          echo "=== Creating Network Volume (single POST, no retry) ==="

          if [ -z "$TARGET_DC" ]; then
            echo "ERROR: no target datacenter resolved from preflight"
            exit 1
          fi

          PAYLOAD=$(jq -n --arg dc "$TARGET_DC" '{
            "name": "photo-restoration-gate3-models",
            "size": 5,
            "dataCenterId": $dc
          }')

          echo "POST payload:"
          echo "$PAYLOAD" | jq 'del(.dataCenterId) + {dataCenterId: "***REDACTED***"}'
          echo ""

          RESPONSE=$(curl -s -X POST https://rest.runpod.io/v1/networkvolumes \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -d "$PAYLOAD" 2>&1)

          VOLUME_ID=$(echo "$RESPONSE" | jq -r '.id // empty' 2>/dev/null)
          if [ -z "$VOLUME_ID" ]; then
            echo "ERROR: Failed to create volume or extract ID from response"
            echo "$RESPONSE" | jq 'del(.id)' 2>/dev/null || echo "(unparseable response)"
            exit 1
          fi

          echo ""
          echo "Volume created with ID: ${VOLUME_ID:0:8}..." # Redacted in logs
          echo "volume_id=${VOLUME_ID}" >> "$GITHUB_OUTPUT"
          echo "volume_id_redacted=${VOLUME_ID:0:8}..." >> "$GITHUB_OUTPUT"

      - name: Post-creation verification (GET volumes)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          echo "=== Post-creation verification: Listing all volumes ==="

          VOLUMES=$(curl -s -X GET https://rest.runpod.io/v1/networkvolumes \
            -H "Authorization: Bearer $RUNPOD_API_KEY" 2>&1)

          echo "Volumes list (name/size/datacenter only):"
          echo "$VOLUMES" | jq '[.[] | {name, size, dataCenterId}]' 2>/dev/null || echo "(unparseable response)"

          COUNT=$(echo "$VOLUMES" | jq '[.[] | select(.name == "photo-restoration-gate3-models")] | length' 2>/dev/null)

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected 1 volume named photo-restoration-gate3-models, found $COUNT"
            exit 1
          fi

          SIZE=$(echo "$VOLUMES" | jq '.[] | select(.name == "photo-restoration-gate3-models") | .size' 2>/dev/null)
          DATACENTER=$(echo "$VOLUMES" | jq -r '.[] | select(.name == "photo-restoration-gate3-models") | .dataCenterId // .datacenter' 2>/dev/null)

          echo ""
          echo "Verification passed:"
          echo "  - Volume count: 1 (photo-restoration-gate3-models)"
          echo "  - Size: $SIZE GB (expected: 5 GB)"
          echo "  - Datacenter (redacted): ${DATACENTER:0:4}***"

          if [ "$SIZE" != "5" ]; then
            echo "ERROR: Size mismatch: expected 5 GB, got $SIZE GB"
            exit 1
          fi

      - name: Publication verification summary
        run: |
          echo "==============================================="
          echo "Network Volume Creation Summary"
          echo "==============================================="
          echo ""
          echo "Preflight verification PASSED (runpodctl datacenter/gpu discovery)"
          echo "Cost guard verification PASSED"
          echo "Volume creation: single POST to /v1/networkvolumes (no retry)"
          echo "No endpoint/template/worker/job operations"
          echo "No raw authenticated response persisted"
          echo "Post-creation verification PASSED"
          echo ""
          echo "Next: Verify region compatibility and run Gate 3 validators"
