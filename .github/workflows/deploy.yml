name: Deploy to Northflank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".kilo/**"
      - "old images/**"

env:
  NODE_VERSION: "24"
  NF_REGISTRY: registry.northflank.com
  NF_IMAGE: registry.northflank.com/northflank/service/6a63423ce0a13e54221997ad

jobs:
  build-and-deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma@5.20.0 generate --schema apps/api/prisma/schema.prisma

      - name: Build
        run: npm run build -w apps/api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Northflank Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NF_REGISTRY }}
          username: northflank
          password: ${{ secrets.NORTHFLANK_API_KEY }}

      - name: Build and push to Northflank registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.NF_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Northflank CLI
        run: npm install -g @northflank/cli

      - name: Deploy the new image
        run: |
          cat <<'EOF' > /tmp/deploy.json
          {
            "image": "${{ env.NF_IMAGE }}:${{ github.sha }}",
            "storage": {
              "shmSize": 64,
              "ephemeralStorage": {
                "storageSize": 1024
              }
            },
            "instances": 1
          }
          EOF
          npx northflank update service deployment \
            --projectId ai-photo-studio \
            --serviceId ai-photo-studio \
            --file /tmp/deploy.json \
            --skipValidation

  verify:
    name: Verify Deployment
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for healthy API
        shell: bash
        run: |
          for i in $(seq 1 36); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://api.thannow.com/api/health" --max-time 10 || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "API healthy after $((i*10))s"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP"
            sleep 10
          done
          echo "API failed to become healthy"
          exit 1

      - name: Verify SHA changed
        shell: bash
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
        run: |
          for i in $(seq 1 12); do
            sleep 10
            SERVICE=$(curl -s -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
              "https://api.northflank.com/v1/projects/ai-photo-studio/services/ai-photo-studio")
            STATUS=$(echo "$SERVICE" | jq -r '.data.status.deployment.status // "unknown"')
            SHA=$(echo "$SERVICE" | jq -r '.data.deployment.internal.deployedSHA // "unknown"')
            echo "Attempt $i: Status=$STATUS SHA=$SHA"
            if [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "DEPLOYING" ]; then
              if [ "$SHA" != "278a14f7209358f240a032bf3a7fd563b7bad2d3" ]; then
                echo "SHA updated: $SHA"
                exit 0
              fi
            fi
            if [ "$STATUS" = "FAILURE" ]; then
              echo "Deployment FAILED"
              exit 1
            fi
          done
          echo "SHA check timeout"
          exit 1


