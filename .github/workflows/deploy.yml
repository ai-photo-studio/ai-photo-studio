name: Deploy to Northflank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".kilo/**"
      - "old images/**"

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/ai-photo-studio/ai-photo-studio/api

jobs:
  build-and-push:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma@5.20.0 generate --schema apps/api/prisma/schema.prisma

      - name: Build
        run: npm run build -w apps/api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Northflank
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ai-photo-studio
          service-id: ai-photo-studio
          image-path: ${{ needs.build-and-push.outputs.image_tag }}
          credentials-id: ${{ secrets.NORTHFLANK_CREDENTIALS_ID }}

  verify:
    name: Verify Deployment
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for healthy API
        shell: bash
        run: |
          for i in $(seq 1 36); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://api.thannow.com/api/health" --max-time 10 || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "API healthy after ${i*10}s"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP"
            sleep 10
          done
          echo "API failed to become healthy"
          exit 1

      - name: Verify SHA changed
        shell: bash
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
        run: |
          SERVICE=$(curl -s -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            "https://api.northflank.com/v1/projects/ai-photo-studio/services/ai-photo-studio")
          SHA=$(echo "$SERVICE" | jq -r '.data.deployment.internal.deployedSHA')
          echo "Deployed SHA: $SHA"
          if [ "$SHA" = "278a14f7209358f240a032bf3a7fd563b7bad2d3" ]; then
            echo "ERROR: SHA unchanged from old deployment"
            exit 1
          fi
          echo "SHA updated successfully"


