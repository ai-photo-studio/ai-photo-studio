name: Deploy to Northflank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".kilo/**"
      - "old images/**"


env:
  NODE_VERSION: "24"
  NF_PROJECT_ID: ai-photo-studio
  NF_SERVICE_ID: ai-photo-studio
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma@5.20.0 generate --schema apps/api/prisma/schema.prisma

      - name: Build
        run: npm run build -w apps/api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILD_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Northflank service deployment
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
          BUILD_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ env.GHCR_IMAGE }}@${{ steps.build_image.outputs.digest }}
        run: |
          cat <<'EOF' > /tmp/runtime.json
          {
            "runtimeEnvironment": {
              "BUILD_SHA": "__BUILD_SHA__"
            }
          }
          EOF
          sed -i "s#__BUILD_SHA__#$BUILD_SHA#g" /tmp/runtime.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/runtime.json \
            "https://api.northflank.com/v1/projects/${{ env.NF_PROJECT_ID }}/services/${{ env.NF_SERVICE_ID }}/runtime-environment"

          cat <<'EOF' > /tmp/deploy.json
          {
            "deployment": {
              "instances": 1,
              "docker": {
                "configType": "default"
              },
              "storage": {
                "shmSize": 64,
                "ephemeralStorage": {
                  "storageSize": 1024
                }
              },
              "external": {
                "imagePath": "__IMAGE_TAG__",
                "credentials": "ghcr"
              }
            }
          }
          EOF
          sed -i "s#__IMAGE_TAG__#$IMAGE_TAG#g" /tmp/deploy.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/deploy.json \
            "https://api.northflank.com/v1/projects/${{ env.NF_PROJECT_ID }}/services/${{ env.NF_SERVICE_ID }}/deployment"

  verify:
    name: Verify Deployment
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for healthy API
        shell: bash
        run: |
          for i in $(seq 1 36); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://api.thannow.com/api/health" --max-time 10 || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "API healthy after $((i*10))s"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP"
            sleep 10
          done
          echo "API failed to become healthy"
          exit 1

      - name: Verify runtime SHA
        shell: bash
        run: |
          for i in $(seq 1 12); do
            sleep 10
            VERSION=$(curl -sS --max-time 10 "https://api.thannow.com/api/version" || true)
            HEALTH=$(curl -sS --max-time 10 "https://api.thannow.com/api/health" || true)
            BUILD_SHA=$(printf '%s' "$VERSION" | jq -r '.buildSha // .data.buildSha // "unknown"' 2>/dev/null || echo "unknown")
            HEALTH_SHA=$(printf '%s' "$HEALTH" | jq -r '.build_sha // .data.build_sha // "unknown"' 2>/dev/null || echo "unknown")
            echo "Attempt $i: version_sha=$BUILD_SHA health_sha=$HEALTH_SHA"
            if [ "$BUILD_SHA" = "${{ github.sha }}" ] || [ "$HEALTH_SHA" = "${{ github.sha }}" ]; then
              echo "Runtime SHA matched: ${{ github.sha }}"
              exit 0
            fi
          done
          echo "Runtime SHA check timeout"
          exit 1

  paid-restoration-smoke:
    name: Manual Paid Restoration Smoke Test
    if: github.event_name == 'workflow_dispatch'
    needs: [build-and-deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run guarded paid smoke test
        env:
          ADMIN_AUTH_TOKEN: ${{ secrets.ADMIN_AUTH_TOKEN }}
        run: npm run test:restoration:paid-smoke
