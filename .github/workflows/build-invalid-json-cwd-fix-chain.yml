name: Build Invalid-JSON-Stdout cwd-Fix Chain (Handler -> Volume handler)

# Build-only, unpublished, two-image Gate 2 readiness verification for the
# subprocess cwd= stdout-protocol fix (confirmed root cause of Gate 3 canary
# run 30702245089, "worker produced invalid non-JSON output"; see
# docs/restoration/runpod-invalid-json-stdout-fix.json). Builds, in strict
# dependency order:
#   1. cwd-fixed Serverless handler -> apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev/
#      (FROM the immutable, already-published corrected CLI digest, an
#      anonymous registry pull -- no login, no credentials, no push)
#   2. cwd-fixed volume-mapped handler -> apps/api/runpod-worker-gpu-serverless-volume-restore-unpack-fix-cwd-dev/
#      (FROM stage 1's local image tag)
# No registry login. No packages:write. No push anywhere. No RunPod/S3 call.
# No GPU inference. No image publication. No endpoint/template/job of any
# kind is created; nothing outside this GitHub Actions runner is touched.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly BUILD_CWD_FIX_CHAIN_ONLY to run this build-only (no push) job'
        required: true

permissions:
  contents: read

concurrency:
  group: invalid-json-cwd-fix-chain-build
  cancel-in-progress: false

jobs:
  build-test-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "BUILD_CWD_FIX_CHAIN_ONLY" ]; then
            echo "ERROR: confirmation must be exactly BUILD_CWD_FIX_CHAIN_ONLY"
            exit 1
          fi
          echo "PASSED: confirmation matches"

      - name: Check repository
        uses: actions/checkout@v4

      - name: Record source commit and candidate subtree hashes
        id: provenance
        run: |
          echo "source_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          handler_subtree=$(git rev-parse HEAD:apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev)
          volume_subtree=$(git rev-parse HEAD:apps/api/runpod-worker-gpu-serverless-volume-restore-unpack-fix-cwd-dev)
          echo "handler_subtree=${handler_subtree}" >> "$GITHUB_OUTPUT"
          echo "volume_subtree=${volume_subtree}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${{ github.sha }}"
          echo "handler_subtree=${handler_subtree}"
          echo "volume_subtree=${volume_subtree}"

      - name: Prove Dockerfile parent is the exact immutable published CLI digest
        run: |
          set -euo pipefail
          expected="sha256:f97245866394310c3aed065e48ebac63555e8f451480b79eebea98f437cb4052"
          from_line=$(grep -m1 '^FROM ' apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev/Dockerfile)
          echo "$from_line"
          echo "$from_line" | grep -q "runpod-worker-gpu-dev-restore-unpack-fix@${expected}" \
            || { echo "ERROR: Dockerfile FROM does not pin the expected immutable published CLI digest" >&2; exit 1; }
          echo "PASSED: handler Dockerfile FROM pins the exact expected published digest"

      # Plain `docker build` (not docker/build-push-action + buildx) is used
      # deliberately: docker/setup-buildx-action creates an isolated
      # docker-container builder whose image store is separate from the host
      # Docker engine, so stage 2's "FROM gfpgan-serverless-restore-fix-cwd:local"
      # cannot see stage 1's locally-built image. Plain `docker build` always
      # uses the host engine's shared image store, so the FROM reference
      # resolves correctly. This is build-only, push:false in spirit (no
      # --push, no registry login anywhere in this job).

      # -----------------------------------------------------------------
      # Stage 1: cwd-fixed Serverless handler candidate
      # (FROM the published, immutable CLI digest -- anonymous registry pull)
      # -----------------------------------------------------------------
      - name: "Stage 1 - Build cwd-fixed Serverless handler candidate (no push)"
        run: docker build --tag gfpgan-serverless-restore-fix-cwd:local --file apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev/Dockerfile apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev

      - name: "Stage 1 - Inspect handler candidate metadata"
        id: handler-meta
        run: |
          docker image inspect gfpgan-serverless-restore-fix-cwd:local > "$RUNNER_TEMP/handler-inspect.json"
          echo "image_id=$(jq -r '.[0].Id' "$RUNNER_TEMP/handler-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(jq -r '.[0].Size' "$RUNNER_TEMP/handler-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "user=$(jq -r '.[0].Config.User' "$RUNNER_TEMP/handler-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "env=$(jq -c '.[0].Config.Env' "$RUNNER_TEMP/handler-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "cmd=$(jq -c '.[0].Config.Cmd' "$RUNNER_TEMP/handler-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "entrypoint=$(jq -c '.[0].Config.Entrypoint' "$RUNNER_TEMP/handler-inspect.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/handler-inspect.json" | jq '.[0] | {Id,Size,Config:{User,Env,Cmd,Entrypoint}}'

      - name: "Stage 1 - Verify non-root, cleared entrypoint, handler CMD, no bundled weight, safe-load env"
        run: |
          set -euo pipefail
          user=$(jq -r '.[0].Config.User' "$RUNNER_TEMP/handler-inspect.json")
          entry=$(jq -r '.[0].Config.Entrypoint | tojson' "$RUNNER_TEMP/handler-inspect.json")
          cmd=$(jq -r '.[0].Config.Cmd | tojson' "$RUNNER_TEMP/handler-inspect.json")
          [ "$user" != "root" ] && [ "$user" != "" ] || { echo "ERROR: not non-root" >&2; exit 1; }
          [ "$entry" = "null" ] || [ "$entry" = "[]" ] || { echo "ERROR: entrypoint not cleared" >&2; exit 1; }
          echo "$cmd" | grep -q "handler.py" || { echo "ERROR: handler CMD missing" >&2; exit 1; }
          has=$(docker run --rm --entrypoint sh gfpgan-serverless-restore-fix-cwd:local -c "test -f /models/GFPGANv1.4.pth && echo present || echo absent")
          [ "$has" = "absent" ] || { echo "ERROR: weight bundled" >&2; exit 1; }
          env_has_flag=$(docker run --rm --entrypoint sh gfpgan-serverless-restore-fix-cwd:local -c 'echo $TORCH_FORCE_WEIGHTS_ONLY_LOAD')
          [ "$env_has_flag" = "1" ] || { echo "ERROR: TORCH_FORCE_WEIGHTS_ONLY_LOAD not 1" >&2; exit 1; }
          echo "Stage 1 PASSED: user=$user entrypoint=$entry cmd=$cmd, no bundled weight, safe-load env present"

      - name: "Stage 1 - Prove the cwd= fix is present, exit codes and timeout unchanged"
        run: |
          docker run --rm -i --network none -w /srv/handler gfpgan-serverless-restore-fix-cwd:local \
            python3.10 -c "import handler as h; assert h.WORKER == ['python3.10', '/srv/worker/worker.py'], h.WORKER; assert h.WORKER_DIR == '/srv/worker', h.WORKER_DIR; assert h.EXECUTION_TIMEOUT_SECONDS == 120, h.EXECUTION_TIMEOUT_SECONDS; assert h.EXIT_INPUT == 2, h.EXIT_INPUT; assert h.EXIT_WEIGHT == 4, h.EXIT_WEIGHT; assert h.EXIT_CUDA == 5, h.EXIT_CUDA; print('cwd fix + exit codes + timeout confirmed unchanged/present')"

      - name: "Stage 1 - Run cwd-fix regression + full handler contract test suite (network none, mocks only)"
        run: |
          docker run --rm -i --network none \
            -v "$PWD/apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev/test_handler.py":/srv/handler/test_handler.py:ro \
            -w /srv/handler \
            gfpgan-serverless-restore-fix-cwd:local \
            python3.10 -m unittest test_handler -v 2>&1 | tail -40

      - name: "Stage 1 - No base64/path/secret leakage in source"
        run: |
          set -euo pipefail
          src="apps/api/runpod-worker-gpu-serverless-restore-unpack-fix-cwd-dev/handler.py"
          ! grep -qi "RUNPOD_API_KEY\|api_key=\|password=\|Authorization:\|Bearer " "$src"
          ! grep -q "print(" "$src"
          echo "Stage 1 PASSED: no secret/credential literals, no stray stdout prints in handler.py"

      - name: "Stage 1 - SBOM and vulnerability scan"
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-serverless-restore-fix-cwd:local
          format: cyclonedx
          output: handler-sbom.json

      - name: "Stage 1 - Scan for CRITICAL (must be zero)"
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-serverless-restore-fix-cwd:local
          format: json
          output: handler-trivy.json
          exit-code: 0
          severity: CRITICAL
          ignore-unfixed: true

      - name: "Stage 1 - Assert zero CRITICAL and CVE-2025-32434 absent"
        id: handler-scan
        run: |
          jq -e '(.Results | to_entries | map(.value.Vulnerabilities // []) | add | length) == 0' handler-trivy.json >/dev/null 2>&1 \
            || { echo "HANDLER CRITICAL PRESENT" >&2; exit 1; }
          if grep -q "CVE-2025-32434" handler-trivy.json; then echo "HANDLER CVE-2025-32434 PRESENT" >&2; exit 1; fi
          components=$(jq -r '.components | length' handler-sbom.json 2>/dev/null || echo 0)
          echo "sbom_components=${components}" >> "$GITHUB_OUTPUT"
          echo "Stage 1: SBOM components: ${components}"

      # -----------------------------------------------------------------
      # Stage 2: cwd-fixed volume-mapped candidate (FROM stage 1, local)
      # -----------------------------------------------------------------
      - name: "Stage 2 - Build cwd-fixed volume-mapped candidate (no push)"
        run: docker build --tag gfpgan-serverless-volume-restore-fix-cwd:local --file apps/api/runpod-worker-gpu-serverless-volume-restore-unpack-fix-cwd-dev/Dockerfile apps/api/runpod-worker-gpu-serverless-volume-restore-unpack-fix-cwd-dev

      - name: "Stage 2 - Inspect volume candidate metadata"
        id: volume-meta
        run: |
          docker image inspect gfpgan-serverless-volume-restore-fix-cwd:local > "$RUNNER_TEMP/volume-inspect.json"
          echo "image_id=$(jq -r '.[0].Id' "$RUNNER_TEMP/volume-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(jq -r '.[0].Size' "$RUNNER_TEMP/volume-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "user=$(jq -r '.[0].Config.User' "$RUNNER_TEMP/volume-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "cmd=$(jq -c '.[0].Config.Cmd' "$RUNNER_TEMP/volume-inspect.json")" >> "$GITHUB_OUTPUT"
          echo "entrypoint=$(jq -c '.[0].Config.Entrypoint' "$RUNNER_TEMP/volume-inspect.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/volume-inspect.json" | jq '.[0] | {Id,Size,Config:{User,Cmd,Entrypoint}}'

      - name: "Stage 2 - Verify non-root workeruser, cleared entrypoint, inherited handler CMD"
        run: |
          set -euo pipefail
          user=$(jq -r '.[0].Config.User' "$RUNNER_TEMP/volume-inspect.json")
          entry=$(jq -r '.[0].Config.Entrypoint | tojson' "$RUNNER_TEMP/volume-inspect.json")
          cmd=$(jq -r '.[0].Config.Cmd | tojson' "$RUNNER_TEMP/volume-inspect.json")
          [ "$user" = "workeruser" ] || { echo "ERROR: not workeruser" >&2; exit 1; }
          [ "$entry" = "null" ] || [ "$entry" = "[]" ] || { echo "ERROR: entrypoint not cleared" >&2; exit 1; }
          echo "$cmd" | grep -q "handler.py" || { echo "ERROR: handler CMD missing/changed" >&2; exit 1; }
          echo "Stage 2 PASSED: user=$user entrypoint=$entry cmd=$cmd"

      - name: "Stage 2 - Verify /models symlink contract (build-time only, not runtime-writable)"
        run: |
          set -euo pipefail
          target=$(docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c 'readlink /models')
          [ "$target" = "/runpod-volume/models" ] || { echo "ERROR: symlink target mismatch: $target" >&2; exit 1; }
          is_link=$(docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c 'test -L /models && echo yes || echo no')
          [ "$is_link" = "yes" ] || { echo "ERROR: /models is not a symlink" >&2; exit 1; }
          runtime_user=$(docker run --rm --network none --entrypoint whoami gfpgan-serverless-volume-restore-fix-cwd:local)
          [ "$runtime_user" = "workeruser" ] || { echo "ERROR: root leaked into runtime: $runtime_user" >&2; exit 1; }
          set +e
          docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c "rm -f /models" 2>rmerr.txt
          rc=$?
          set -e
          cat rmerr.txt
          [ "$rc" -ne 0 ] || { echo "ERROR: workeruser was able to remove /models" >&2; exit 1; }
          echo "Stage 2 PASSED: symlink -> $target, runtime user $runtime_user, not runtime-writable"

      - name: "Stage 2 - Verify no weights bundled"
        run: |
          set +e
          has=$(docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c "test -f /runpod-volume/models/GFPGANv1.4.pth 2>/dev/null && echo present || echo absent")
          set -e
          [ "$has" = "absent" ] || { echo "ERROR: weights present" >&2; exit 1; }

      - name: "Stage 2 - Test: missing volume fails closed (EXIT_WEIGHT=4, no download, network none)"
        run: |
          set -euo pipefail
          set +e
          out=$(docker run --rm -i --network none --entrypoint python3.10 gfpgan-serverless-volume-restore-fix-cwd:local \
            /srv/worker/worker.py --stdin <<< '{"mode":"restore","imageBase64":"AAAA"}' 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 4 ] || { echo "EXPECTED EXIT_WEIGHT(4), GOT $rc" >&2; exit 1; }
          echo "Stage 2 PASSED: missing volume fails closed before model construction, no network access needed"

      - name: "Stage 2 - Build synthetic (non-real) placeholder weight fixtures for mount tests"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valid-volume/models/facexlib"
          printf 'synthetic-not-a-real-weight' > "$RUNNER_TEMP/valid-volume/models/GFPGANv1.4.pth"
          printf 'synthetic-not-a-real-weight' > "$RUNNER_TEMP/valid-volume/models/facexlib/detection_Resnet50_Final.pth"
          printf 'synthetic-not-a-real-weight' > "$RUNNER_TEMP/valid-volume/models/facexlib/parsing_parsenet.pth"

      - name: "Stage 2 - Test: invalid weights (wrong size/hash) rejected before model construction"
        run: |
          set -euo pipefail
          set +e
          out=$(docker run --rm -i --network none \
            -v "$RUNNER_TEMP/valid-volume:/runpod-volume:ro" \
            --entrypoint python3.10 \
            gfpgan-serverless-volume-restore-fix-cwd:local /srv/worker/worker.py --stdin <<< '{"mode":"restore","imageBase64":"AAAA"}' 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 4 ] || { echo "EXPECTED EXIT_WEIGHT(4) FOR MISMATCHED CHECKSUM, GOT $rc" >&2; exit 1; }
          echo "$out" | grep -qi "checksum mismatch\|size mismatch" || { echo "EXPECTED SIZE/CHECKSUM MESSAGE" >&2; exit 1; }
          echo "Test PASSED: invalid weight rejected before model construction (gpu_inference_executed=false)"

      - name: "Stage 2 - Test: health delegates through symlink, providerPostCount=0, productionRoutingAllowed=false"
        run: |
          set -euo pipefail
          out=$(docker run --rm -i --network none --entrypoint python3.10 gfpgan-serverless-volume-restore-fix-cwd:local \
            /srv/worker/worker.py --stdin <<< '{"mode":"health"}')
          echo "$out"
          echo "$out" | jq -e '.providerPostCount == 0 and .productionRoutingAllowed == false' >/dev/null \
            || { echo "FAIL-CLOSED INVARIANTS MISSING" >&2; exit 1; }

      - name: "Stage 2 - Run mount-contract tests unchanged (network none)"
        run: |
          docker run --rm -i --network none \
            -v "$RUNNER_TEMP/valid-volume:/runpod-volume:ro" \
            -v "$PWD/apps/api/runpod-worker-gpu-serverless-volume-restore-unpack-fix-cwd-dev/test_mount_contract.py":/srv/handler/test_mount_contract.py:ro \
            -w /srv/handler \
            gfpgan-serverless-volume-restore-fix-cwd:local \
            python3.10 -m unittest test_mount_contract -v 2>&1 | tail -20

      - name: "Stage 2 - Prove the cwd fix carries through end to end, safe-load env still present"
        run: |
          set -euo pipefail
          cwd_line=$(docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c "grep -n 'cwd=WORKER_DIR' /srv/handler/handler.py")
          echo "$cwd_line"
          [ -n "$cwd_line" ] || { echo "ERROR: volume-mapped image does not carry the cwd= fix" >&2; exit 1; }
          fixed_line=$(docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c "grep -n 'model.enhance' /srv/worker/worker.py")
          echo "$fixed_line"
          echo "$fixed_line" | grep -q '_, _, out = model.enhance' || { echo "ERROR: does not carry the corrected unpack fix" >&2; exit 1; }
          env_has_flag=$(docker run --rm --network none --entrypoint sh gfpgan-serverless-volume-restore-fix-cwd:local -c 'echo $TORCH_FORCE_WEIGHTS_ONLY_LOAD')
          [ "$env_has_flag" = "1" ] || { echo "ERROR: TORCH_FORCE_WEIGHTS_ONLY_LOAD not 1" >&2; exit 1; }
          echo "PASSED: cwd fix + unpack fix + safe-load env all confirmed present end to end"

      - name: "Stage 2 - SBOM and vulnerability scan"
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-serverless-volume-restore-fix-cwd:local
          format: cyclonedx
          output: volume-sbom.json

      - name: "Stage 2 - Scan for CRITICAL (must be zero)"
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gfpgan-serverless-volume-restore-fix-cwd:local
          format: json
          output: volume-trivy.json
          exit-code: 0
          severity: CRITICAL
          ignore-unfixed: true

      - name: "Stage 2 - Assert zero CRITICAL and CVE-2025-32434 absent"
        id: volume-scan
        run: |
          jq -e '(.Results | to_entries | map(.value.Vulnerabilities // []) | add | length) == 0' volume-trivy.json >/dev/null 2>&1 \
            || { echo "VOLUME CRITICAL PRESENT" >&2; exit 1; }
          if grep -q "CVE-2025-32434" volume-trivy.json; then echo "VOLUME CVE-2025-32434 PRESENT" >&2; exit 1; fi
          components=$(jq -r '.components | length' volume-sbom.json 2>/dev/null || echo 0)
          echo "sbom_components=${components}" >> "$GITHUB_OUTPUT"
          echo "Stage 2: SBOM components: ${components}"

      - name: Chain summary
        if: always()
        run: |
          echo "### Invalid-JSON cwd-fix chain build summary (build-only, no push)" >> "$GITHUB_STEP_SUMMARY"
          echo "- source_commit: ${{ steps.provenance.outputs.source_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- handler_subtree: ${{ steps.provenance.outputs.handler_subtree }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- volume_subtree: ${{ steps.provenance.outputs.volume_subtree }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- parent CLI digest (registry, unchanged, published): sha256:f97245866394310c3aed065e48ebac63555e8f451480b79eebea98f437cb4052" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stage 1 (Serverless handler, cwd fix): image_id=${{ steps.handler-meta.outputs.image_id }} size=${{ steps.handler-meta.outputs.size_bytes }} sbom_components=${{ steps.handler-scan.outputs.sbom_components }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stage 2 (Volume-mapped, cwd fix): image_id=${{ steps.volume-meta.outputs.image_id }} size=${{ steps.volume-meta.outputs.size_bytes }} sbom_components=${{ steps.volume-scan.outputs.sbom_components }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- gpu_inference_executed=false" >> "$GITHUB_STEP_SUMMARY"
          echo "- published=false; registry_login=false; packages_write=false; runpod_resources_created=none; runpod_api_calls=0; s3_calls=0" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup transient files (always)
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/valid-volume" 2>/dev/null || true
          echo "transient files removed; no weight uploaded; no image published"
