name: Staging Infra Audit (read-only)

# R9.5-P5U: read-only reconnaissance only. Lists existing Northflank
# services and existing Neon branches so a staging environment can reuse
# what already exists instead of creating duplicate infrastructure. Never
# creates, modifies, or deletes anything. Never prints a secret value.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: List existing Northflank services and Neon branches
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: List Northflank services (read-only)
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${NORTHFLANK_API_KEY}"
          echo "--- projects ---"
          curl --fail --silent -H "Authorization: Bearer ${NORTHFLANK_API_KEY}" \
            "https://api.northflank.com/v1/projects" | jq -r '.data.projects[]? // .data[]? | {id, name}' || echo "projects call failed"
          echo "--- services in ai-photo-studio project ---"
          curl --fail --silent -H "Authorization: Bearer ${NORTHFLANK_API_KEY}" \
            "https://api.northflank.com/v1/projects/ai-photo-studio/services" | jq -r '.data.services[]? // .data[]? | {id, name}' || echo "services call failed"

      - name: List Neon branches (read-only)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${NEON_API_KEY}"
          echo "::add-mask::${NEON_PROJECT_ID}"
          curl --fail --silent -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            | jq -r '.branches[] | {id, name, primary, created_at, parent_id}'
